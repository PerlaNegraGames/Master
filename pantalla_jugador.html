<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUGAPRO - Transmisión en Vivo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --fondo: #050505;
            --panel: #0f0f0f;
            --verde: #39ff14;
            --amarillo: #ffcc00;
            --cian: #00f3ff;
            --rojo: #ff0055;
            --texto: #ffffff;
        }

        body {
            background: radial-gradient(circle, #0f0f0f 0%, #000000 100%);
            color: var(--texto);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* ANIMACIONES */
        @keyframes pulseBall {
            0% { transform: scale(1); box-shadow: 0 0 20px rgba(57, 255, 20, 0.3); }
            50% { transform: scale(1.08); box-shadow: 0 0 45px rgba(57, 255, 20, 0.8); }
            100% { transform: scale(1); box-shadow: 0 0 20px rgba(57, 255, 20, 0.3); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animar-bola {
            animation: pulseBall 0.5s ease-in-out;
        }

        .btn-efecto { 
            background: #000; 
            border: 1px solid #FF69B4; 
            color: #FF69B4; 
            padding: 8px 15px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 11px; 
            text-transform: uppercase; 
            transition: all 0.3s ease; 
        }
        .btn-efecto:hover { 
            border-color: var(--cian); 
            color: var(--cian); 
            box-shadow: 0 0 15px var(--cian); 
            transform: translateY(-2px);
        }

        /* CAPA LOGIN JUGADOR */
        #capa-login-jugador {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: radial-gradient(circle, #111 0%, #000 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.4s ease-out;
        }

        .login-card {
            background: rgba(15, 15, 15, 0.95);
            border: 2px solid var(--verde);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 0 35px rgba(57, 255, 20, 0.25);
            width: 100%;
            max-width: 320px;
            box-sizing: border-box;
            position: relative;
            backdrop-filter: blur(10px);
        }

        .login-card h1 {
            color: var(--verde);
            font-size: 18px;
            letter-spacing: 2px;
            margin-top: 0;
            margin-bottom: 25px;
            text-shadow: 0 0 10px rgba(57, 255, 20, 0.4);
        }

        .input-group { width: 100%; margin-bottom: 15px; }
        .input-group input {
            background: #000;
            border: 1px solid #333;
            color: #fff;
            padding: 12px;
            text-align: center;
            font-size: 15px;
            width: 100%;
            outline: none;
            border-radius: 8px;
            box-sizing: border-box;
            font-weight: bold;
            transition: 0.3s;
        }
        .input-group input:focus {
            border-color: var(--verde);
            box-shadow: 0 0 12px rgba(57, 255, 20, 0.4);
        }

        .btn-ingresar {
            background: var(--verde);
            color: #000;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.4);
            margin-top: 10px;
            transition: all 0.3s ease;
        }
        .btn-ingresar:hover {
            box-shadow: 0 0 25px rgba(57, 255, 20, 0.8);
            transform: scale(1.02);
        }
        #err-log-jugador { color: var(--rojo); margin-top: 15px; font-size: 11px; font-weight: bold; text-transform: uppercase; }

        /* CONTENIDO JUGADOR GENERAL */
        #contenido-jugador {
            width: 100%;
            max-width: 1750px;
            display: none;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.5s ease-out;
        }

        .header-top { 
            width: 100%; 
            background: rgba(5, 5, 5, 0.8); 
            backdrop-filter: blur(8px);
            border-bottom: 1px solid #151515; 
            display: flex; 
            justify-content: center; 
            padding: 15px 0; 
            margin-bottom: 20px;
            box-sizing: border-box;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .contenedor-central { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            width: 100%; 
            max-width: 1700px; 
            padding: 0 20px;
        }

        /* DISEÑO DE LAYOUT CON 3 COLUMNAS */
        .layout-principal {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1700px;
            box-sizing: border-box;
            align-items: flex-start;
            justify-content: center;
        }

        /* BARRA LATERAL IZQUIERDA (ONLINE) */
        .sidebar-conectados {
            width: 240px;
            background: #080808;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 15px;
            box-sizing: border-box;
            flex-shrink: 0;
        }
        .sidebar-conectados h3 {
            color: var(--verde);
            font-size: 12px;
            text-transform: uppercase;
            margin-top: 0;
            margin-bottom: 12px;
            border-bottom: 1px solid #222;
            padding-bottom: 8px;
            letter-spacing: 1px;
        }
        #lista-conectados-jugador {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 450px;
            overflow-y: auto;
        }
        .item-conectado {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #111;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 12px;
            border: 1px solid #1a1a1a;
        }
        .punto-online {
            width: 8px;
            height: 8px;
            background: var(--verde);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--verde);
        }

        /* COLUMNA CENTRAL (PRINCIPAL) */
        .main-columna {
            width: 750px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
        }

        /* COLUMNA DERECHA (PÁGINA WEB 650x486) */
        .sidebar-derecha {
            width: 650px;
            background: #080808;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 15px;
            box-sizing: border-box;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .sidebar-derecha h3 {
            color: var(--cian);
            font-size: 12px;
            text-transform: uppercase;
            margin-top: 0;
            margin-bottom: 12px;
            border-bottom: 1px solid #222;
            padding-bottom: 8px;
            letter-spacing: 1px;
            width: 100%;
            text-align: center;
        }
        .contenedor-iframe-web {
            width: 650px;
            height: 486px;
            border: 1px solid #333;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }
        .contenedor-iframe-web iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .header-transmision { text-align: center; margin-bottom: 20px; }
        .header-transmision h1 {
            color: var(--verde);
            margin: 0 0 5px 0;
            font-size: 26px;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(57, 255, 20, 0.4);
        }
        .en-directo { color: var(--verde); font-size: 11px; font-weight: bold; letter-spacing: 1px; }

        /* BOLA CONTENEDOR OPTIMIZADA PARA TEXTOS LARGOS */
        .bola-contenedor {
            background: radial-gradient(circle, #222 0%, #000 80%);
            border: 4px solid var(--verde);
            border-radius: 50%;
            width: 140px;
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(57, 255, 20, 0.3);
            margin-bottom: 15px;
            text-align: center;
            overflow: hidden;
            padding: 15px;
            box-sizing: border-box;
            transition: transform 0.3s ease;
        }

        #ultimo-elemento-vivo {
            font-size: 16px;
            font-weight: 900;
            color: var(--amarillo);
            word-break: break-word;
            line-height: 1.15;
            text-align: center;
            text-shadow: 0 0 12px rgba(255, 204, 0, 0.5);
            max-width: 100%;
            max-height: 100%;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
        }

        #contador-extraidas {
            background: rgba(15, 15, 15, 0.9);
            border: 1px solid #333;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 12px;
            color: var(--cian);
            margin-bottom: 25px;
            letter-spacing: 1px;
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.15);
        }

        #tablero-grid-jugador {
            display: grid;
            gap: 6px;
            width: 100%;
            background: var(--panel);
            border: 1px solid #222;
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.8);
            box-sizing: border-box;
            margin-bottom: 40px;
        }

        .celda {
            background: #121212;
            color: #666;
            padding: 12px 4px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            font-size: 11px;
            border: 1px solid #1a1a1a;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
        }

        .marcada {
            background: var(--verde);
            color: #000;
            box-shadow: 0 0 12px rgba(57, 255, 20, 0.6);
            border-color: #fff;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <!-- CAPA DE LOGIN DE JUGADOR -->
    <div id="capa-login-jugador">
        <div class="login-card">
            <button onclick="window.close()" class="btn-efecto" style="position: absolute; top: 15px; right: 15px; border-color: red; color: red;" title="CERRAR VENTANA"><i class="fas fa-times"></i></button>
            <h1>ACCESO JUGADOR</h1>
            <div class="input-group">
                <input type="text" id="login-nick" placeholder="TU NICK" autocomplete="off">
            </div>
            <div class="input-group">
                <input type="password" id="login-pin" placeholder="PIN" autocomplete="off">
            </div>
            <button id="btn-login-jugador" class="btn-ingresar">ENTRAR</button>
            <div id="err-log-jugador"></div>
        </div>
    </div>

    <!-- CONTENIDO PRINCIPAL DE TRANSMISIÓN -->
    <div id="contenido-jugador">
        <div class="header-top">
            <div class="contenedor-central">
                <div style="font-size: 20px; font-weight: 900; letter-spacing: 2px;">JUGA<span style="color:var(--cian)">PRO</span></div>
                <button onclick="window.cerrarSesionJugador()" class="btn-efecto" style="border-color: #A020F0; color: #A020F0;" title="SALIR"><i class="fas fa-power-off"></i> SALIR</button>
            </div>
        </div>

        <div class="layout-principal">
            <!-- COLUMNA IZQUIERDA: JUGADORES CONECTADOS -->
            <div class="sidebar-conectados">
                <h3>🟢 Conectados (<span id="count-conectados">0</span>)</h3>
                <div id="lista-conectados-jugador"></div>
            </div>

            <!-- COLUMNA CENTRAL: JUEGO, TABLERO Y CHAT -->
            <div class="main-columna">
                <div class="header-transmision">
                    <h1 id="titulo-juego-vivo">CONECTANDO...</h1>
                    <div class="en-directo">🟢 TRANSMISIÓN EN DIRECTO</div>
                </div>

                <div class="bola-contenedor" id="bola-animacion">
                    <div id="ultimo-elemento-vivo">--</div>
                </div>

                <div id="contador-extraidas">EXTRAÍDAS: 0</div>
                <div id="tablero-grid-jugador"></div>

                <!-- CHAT EN VIVO INTEGRADO -->
                <div id="chat-container" style="width: 100%; background: #080808; border: 1px solid #222; border-radius: 12px; margin-bottom: 40px; display: flex; flex-direction: column; box-sizing: border-box;">
                    <div style="display:flex; justify-content:space-between; align-items:center; padding: 10px; border-bottom:1px solid #222;">
                        <span style="font-weight:bold; color:var(--cian); font-size: 13px;">💬 CHAT EN VIVO</span>
                        <button id="btn-limpiar-chat" class="btn-efecto" style="padding: 4px 10px; font-size: 10px; border-color: var(--amarillo); color: var(--amarillo);">🧹 LIMPIAR</button>
                    </div>
                    <div id="mensajes-chat" style="height: 200px; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 6px; font-size: 13px;"></div>
                    <div style="display: flex; padding: 10px; gap: 5px; background: #000;">
                        <input type="text" id="input-chat" placeholder="Escribe un mensaje..." style="flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #333; background: #111; color: #fff; outline: none;" autocomplete="off">
                        <button id="btn-enviar-chat" class="btn-efecto">ENVIAR</button>
                    </div>
                </div>
            </div>

            <!-- COLUMNA DERECHA: PÁGINA WEB DINÁMICA (650x486) -->
            <div class="sidebar-derecha">
                <h3 id="titulo-panel-derecho">🌐 SALA DE XAT</h3>
                <div class="contenedor-iframe-web">
                    <iframe id="iframe-xat-jugador" src="" title="Sala de Xat"></iframe>
                </div>
            </div>
        </div>

                "Starmie", "Mr. Mime", "Scyther", "Jynx", "Electabuzz", "Magmar", "Pinsir", "Tauros", "Magikarp", "Gyarados",
                "Lapras", "Ditto", "Eevee", "Vaporeon", "Jolteon", "Flareon", "Porygon", "Omanyte", "Omastar", "Kabuto",
                "Kabutops", "Aerodactyl", "Snorlax", "Articuno", "Zapdos", "Moltres", "Dratini", "Dragonair", "Dragonite", "Mewtwo", "Mew"
            ]
        };

        let unsubscribeJuego = null;
        let ultimoValorAnterior = "";
        
        const tiempoInicioCliente = Date.now();

        function registrarPresencia(nick) {
            const estadoRef = ref(rtdb, `proyectos/${miCarpeta}/presencia/${nick}`);
            set(estadoRef, { estado: 'online', timestamp: Date.now() });
            onDisconnect(estadoRef).set({ estado: 'offline', timestamp: Date.now() });
        }

        function escucharConectados() {
            onValue(ref(rtdb, `proyectos/${miCarpeta}/presencia`), (snapshot) => {
                const data = snapshot.val() || {};
                const contenedorLista = document.getElementById('lista-conectados-jugador');
                const contadorElem = document.getElementById('count-conectados');
                
                let html = "";
                let totalOnline = 0;

                Object.keys(data).forEach(nick => {
                    if (data[nick] && data[nick].estado === 'online') {
                        totalOnline++;
                        html += `
                        <div class="item-conectado">
                            <span class="punto-online"></span>
                            <span style="font-weight: bold; text-transform: uppercase; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${nick}</span>
                        </div>`;
                    }
                });

                if (contadorElem) contadorElem.innerText = totalOnline;
                if (contenedorLista) {
                    contenedorLista.innerHTML = html || '<div style="color: #555; font-size: 11px; text-align: center; padding: 10px;">Nadie conectado</div>';
                }
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            escucharConectados();
            const nickGuardado = localStorage.getItem(`jugador_sesion_${miCarpeta}`);
            if (nickGuardado) {
                document.getElementById('capa-login-jugador').style.display = 'none';
                document.getElementById('contenido-jugador').style.display = 'flex';
                registrarPresencia(nickGuardado);
                iniciarSincronizacion();
            }
        });

        window.cerrarSesionJugador = async () => {
            const nickGuardado = localStorage.getItem(`jugador_sesion_${miCarpeta}`);
            if (nickGuardado) {
                const estadoRef = ref(rtdb, `proyectos/${miCarpeta}/presencia/${nickGuardado}`);
                await set(estadoRef, { estado: 'offline', timestamp: Date.now() });
            }
            localStorage.removeItem(`jugador_sesion_${miCarpeta}`);
            localStorage.removeItem(`jugador_genero_${miCarpeta}`);
            location.reload();
        };

        document.getElementById('btn-login-jugador').onclick = async () => {
            const nick = document.getElementById('login-nick').value.trim().toLowerCase();
            const pin = document.getElementById('login-pin').value.trim();
            const errLog = document.getElementById('err-log-jugador');

            if (!nick || !pin) {
                errLog.innerText = "INGRESA NICK Y PIN";
                return;
            }

            try {
                const regRef = collection(db, "proyectos", miCarpeta, "registrados");
                const snap = await getDocs(regRef);
                
                let aut = false;
                let genero = 'H';
                snap.forEach(d => { 
                    const userData = d.data();
                    const nickDb = (userData.nick || d.id).trim().toLowerCase();
                    const pinDb = String(userData.pin || '').trim();
                    if(nickDb === nick && pinDb === pin) {
                        aut = true;
                        genero = userData.sexo || 'H';
                    }
                });

                if(aut) {
                    localStorage.setItem(`jugador_sesion_${miCarpeta}`, nick);
                    localStorage.setItem(`jugador_genero_${miCarpeta}`, genero);
                    
                    registrarPresencia(nick);

                    document.getElementById('capa-login-jugador').style.display = 'none';
                    document.getElementById('contenido-jugador').style.display = 'flex';
                    iniciarSincronizacion();
                } else {
                    errLog.innerText = "DATOS INCORRECTOS";
                }
            } catch (e) {
                console.error(e);
                errLog.innerText = "ERROR DE CONEXIÓN";
            }
        };

        function hablarTexto(texto) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(texto);
                utterance.lang = 'es-ES';
                utterance.rate = 1.0;
                utterance.pitch = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        const chatRef = ref(rtdb, `proyectos/${miCarpeta}/chat/mensajes`);

        document.getElementById('btn-enviar-chat').onclick = () => {
            const input = document.getElementById('input-chat');
            const texto = input.value.trim();
            if (!texto) return;

            push(chatRef, {
                nick: localStorage.getItem(`jugador_sesion_${miCarpeta}`),
                genero: localStorage.getItem(`jugador_genero_${miCarpeta}`) || 'H',
                texto: texto,
                timestamp: Date.now()
            });
            input.value = '';
        };

        document.getElementById('btn-limpiar-chat').onclick = () => {
            document.getElementById('mensajes-chat').innerHTML = "";
        };

        onChildAdded(chatRef, (snapshot) => {
            const msg = snapshot.val();
            if (!msg) return;

            if (msg.timestamp && msg.timestamp < tiempoInicioCliente) return;

            const chat = document.getElementById('mensajes-chat');
            const color = (msg.genero === 'H') ? '#00f3ff' : '#ff00ff';
            chat.innerHTML += `<div><span style="color:${color}; font-weight:bold;">${msg.nick}:</span> ${msg.texto}</div>`;
            chat.scrollTop = chat.scrollHeight;
        });

        function iniciarSincronizacion() {
            onSnapshot(doc(db, "proyectos", miCarpeta), (snap) => {
                if (!snap.exists()) return;
                const data = snap.data();
                
                // Cargar enlace de la sala de xat en tiempo real
                if (data.urlXat) {
                    const iframe = document.getElementById('iframe-xat-jugador');
                    if (iframe && iframe.src !== data.urlXat) {
                        iframe.src = data.urlXat;
                    }
                }

                const juegoActivo = data.juegoActivo || '50';
                
                if (unsubscribeJuego) unsubscribeJuego();

                unsubscribeJuego = onValue(ref(rtdb, `proyectos/${miCarpeta}/sorteos/${juegoActivo}`), (sSnap) => {
                    const info = sSnap.val() || {};
                    const rawSacados = info.sacados || [];
                    const sacados = Array.isArray(rawSacados) ? rawSacados : Object.values(rawSacados);
                    const ultimoVal = info.ultimo || sacados[sacados.length - 1] || "--";
                    
                    document.getElementById('titulo-juego-vivo').innerText = `JUEGO: ${juegoActivo.toUpperCase()}`;
                    document.getElementById('ultimo-elemento-vivo').innerText = ultimoVal;
                    document.getElementById('contador-extraidas').innerText = `EXTRAÍDAS: ${sacados.length}`;
                    
                    if (ultimoVal !== ultimoValorAnterior && ultimoVal !== "--") {
                        ultimoValorAnterior = ultimoVal;
                        hablarTexto(String(ultimoVal));

                        const bola = document.getElementById('bola-animacion');
                        bola.classList.remove('animar-bola');
                        void bola.offsetWidth; 
                        bola.classList.add('animar-bola');
                    }

                    renderizarTablero(juegoActivo, sacados);
                });
            });
        }

        function renderizarTablero(juego, sacados) {
            const grid = document.getElementById('tablero-grid-jugador');
            if (!grid) return;
            const juegoLower = String(juego).toLowerCase();
            let html = "";

            if (listasJuegos[juegoLower]) {
                const elementos = listasJuegos[juegoLower];
                elementos.forEach((el, index) => {
                    const esta = sacados.includes(el);
                    const prefijoNum = juegoLower === 'pokemon' ? `#${index + 1} ` : '';
                    html += `<div class="celda ${esta ? 'marcada' : ''}" style="font-size: 10px; padding: 10px 2px;">${prefijoNum}${el}</div>`;
                });
                grid.style.gridTemplateColumns = juegoLower === 'pokemon' ? "repeat(auto-fill, minmax(105px, 1fr))" : "repeat(auto-fill, minmax(115px, 1fr))";
                grid.innerHTML = html;
                return;
            }

            let totalNums = 50;
            let columnas = 10;

            if (juegoLower === '72' || juegoLower === 'bingo72') { totalNums = 72; columnas = 9; }
            else if (juegoLower === '90' || juegoLower === 'bingo90') { totalNums = 90; }
            else if (juegoLower === '100' || juegoLower === 'bingo100') { totalNums = 100; }
            else if (juegoLower === 'eliminatorias') { totalNums = 30; columnas = 6; }

            grid.style.gridTemplateColumns = `repeat(${columnas}, 1fr)`;
            for(let i=1; i<=totalNums; i++) {
                const esta = sacados.includes(i) || sacados.includes(String(i)) || sacados.includes(Number(i));
                const textoCelda = juegoLower === 'eliminatorias' ? `P${i}` : i;
                html += `<div class="celda ${esta ? 'marcada' : ''}">${textoCelda}</div>`;
            }
            grid.innerHTML = html;
        }
    </script>
</body>
</html>
