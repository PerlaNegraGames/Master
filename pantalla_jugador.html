<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUGAPRO - Transmisión en Vivo</title>
    <style>
        :root {
            --fondo: #050505;
            --panel: #0f0f0f;
            --verde: #39ff14;
            --amarillo: #ffcc00;
            --cian: #00f3ff;
            --rojo: #ff0055;
            --texto: #ffffff;
        }
        body {
            background-color: var(--fondo);
            color: var(--texto);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header-transmision {
            text-align: center;
            margin-bottom: 20px;
        }
        .header-transmision h1 {
            color: var(--verde);
            margin: 0 0 5px 0;
            font-size: 28px;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(57, 255, 20, 0.4);
        }
        .en-directo {
            color: var(--verde);
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .bola-contenedor {
            background: radial-gradient(circle, #222 0%, #000 80%);
            border: 4px solid var(--verde);
            border-radius: 50%;
            width: 140px;
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(57, 255, 20, 0.3);
            margin-bottom: 25px;
            text-align: center;
            padding: 15px;
        }
        #ultimo-elemento-vivo {
            font-size: 20px;
            font-weight: 900;
            color: var(--amarillo);
            word-break: break-word;
            line-height: 1.2;
            text-align: center;
        }
        #aviso-estado {
            font-size: 14px;
            font-weight: bold;
            padding: 6px 15px;
            border-radius: 20px;
            margin-bottom: 15px;
            display: none;
            text-transform: uppercase;
        }
        .panel-tablero {
            background: var(--panel);
            border: 1px solid #222;
            border-radius: 12px;
            padding: 15px;
            width: 100%;
            max-width: 750px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }
        .info-tablero {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #888;
            margin-bottom: 10px;
            font-weight: bold;
        }
        #tablero-grid-jugador {
            display: grid;
            gap: 5px;
        }
        .celda-num {
            background: #111;
            color: #777;
            padding: 10px 4px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 13px;
            text-align: center;
            transition: all 0.2s ease;
        }
        .celda-num.marcada {
            background: var(--verde);
            color: #000;
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.5);
        }
        .celda-texto {
            background: #111;
            color: #888;
            padding: 10px 6px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 11px;
            text-align: center;
            text-transform: uppercase;
            border: 1px solid #222;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .celda-texto.marcada {
            background: var(--cian);
            color: #000;
            border-color: #fff;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }
    </style>
</head>
<body>

    <div class="header-transmision">
        <h1 id="titulo-juego-vivo">CONECTANDO A FIRESTORE...</h1>
        <div class="en-directo">🟢 TRANSMISIÓN EN DIRECTO</div>
    </div>

    <div id="aviso-estado"></div>

    <div class="bola-contenedor">
        <div id="ultimo-elemento-vivo">--</div>
    </div>

    <div class="panel-tablero">
        <div class="info-tablero">
            <span id="nombre-tablero-label">TABLERO GENERAL</span>
            <span id="contador-extraidas">EXTRAÍDAS: 0</span>
        </div>
        <div id="tablero-grid-jugador"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Configuración de tu proyecto Firebase (asegúrate de que tenga tu apiKey y projectId correctos para Firestore)
        const firebaseConfig = {
            apiKey: "TU_API_KEY", // Opcional si solo usas lectura pública con reglas abiertas
            authDomain: "juegos-16e17.firebaseapp.com",
            projectId: "juegos-16e17"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const miCarpeta = urlParams.get('p') || urlParams.get('proyecto') || 'gh';

        const listasJuegos = {
            "mex": ["El Gallo", "El Diablito", "La Dama", "El Catrín", "El Paraguas", "El Sireno", "La Escalera", "La Botella", "El Barril", "El Árbol", "El Melón", "El Valiente", "El Gorrito", "La Muerte", "La Pera", "La Bandera", "El Bandolón", "El Violoncello", "La Garza", "Pájaro", "La Mano", "La Bota", "El Cotorro", "El Borracho", "El Negrito", "El Corazón", "La Sandía", "El Tambor", "El Músico", "El Arpa", "La Rana"],
            "abcdario": "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split(""),
            "comidas": ["Pizza", "Hamburguesa", "Tacos", "Sushi", "Paella", "Asado", "Pasta", "Hot Dog", "Empanadas", "Arepas", "Ceviche", "Pollo Frito"],
            "paises": ["Argentina", "Brasil", "Chile", "Colombia", "España", "México", "Perú", "Uruguay", "Venezuela", "Ecuador", "Bolivia", "Paraguay", "Costa Rica", "Panamá", "Rep. Dominicana", "Canadá", "EE.UU.", "Francia", "Italia", "Alemania"]
        };

        // Escuchamos el documento del proyecto en Firestore (ej: proyectos/gh)
        const docRef = doc(db, "proyectos", miCarpeta);

        onSnapshot(docRef, (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                console.log("Datos de Firestore:", data);

                const juegoActivo = data.juegoActivo || urlParams.get('juego') || 'mex';
                
                // Buscamos si hay datos específicos del juego en Firestore, o simulamos según el estado global
                const infoJuego = data.sorteos?.[juegoActivo] || data[juegoActivo] || {};
                
                const rawSacados = infoJuego.sacados || data.sacados || [];
                const sacadosList = Array.isArray(rawSacados) ? rawSacados : Object.values(rawSacados);
                const estadoPartida = infoJuego.estado || data.estado || "activo";
                const ultimoElemento = infoJuego.ultimo || data.ultimo || sacadosList[sacadosList.length - 1] || "--";

                document.getElementById('titulo-juego-vivo').innerText = `SORTEO ${juegoActivo.toUpperCase()}`;
                document.getElementById('ultimo-elemento-vivo').innerText = ultimoElemento;
                document.getElementById('contador-extraidas').innerText = `EXTRAÍDAS: ${sacadosList.length}`;

                renderizarTablero(juegoActivo, sacadosList);
            } else {
                console.error("No se encontró el documento del proyecto en Firestore.");
                document.getElementById('titulo-juego-vivo').innerText = "PROYECTO NO ENCONTRADO";
            }
        }, (error) => {
            console.error("Error al escuchar Firestore:", error);
            document.getElementById('titulo-juego-vivo').innerText = "ERROR DE FIRESTORE";
        });

        function renderizarTablero(juego, sacados) {
            const grid = document.getElementById('tablero-grid-jugador');
            if (!grid) return;

            if (listasJuegos[juego]) {
                const elementos = listasJuegos[juego];
                let html = '';
                elementos.forEach((el) => {
                    const marcado = sacados.includes(el);
                    html += `<div class="celda-texto ${marcado ? 'marcada' : ''}">${el}</div>`;
                });
                grid.style.gridTemplateColumns = "repeat(auto-fill, minmax(115px, 1fr))";
                grid.innerHTML = html;
                return;
            }

            // Numérico tradicional
            let totalNums = 90;
            let columnas = 10;
            if (juego === '50') totalNums = 50;
            if (juego === '72') { totalNums = 72; columnas = 9; }
            if (juego === '100') totalNums = 100;

            let htmlNum = '';
            for (let i = 1; i <= totalNums; i++) {
                const marcado = sacados.includes(i) || sacados.includes(String(i));
                htmlNum += `<div class="celda-num ${marcada ? 'marcada' : ''}">${i}</div>`;
            }
            grid.style.gridTemplateColumns = `repeat(${columnas}, 1fr)`;
            grid.innerHTML = htmlNum;
        }
    </script>
</body>
</html>
