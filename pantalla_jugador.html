<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUGAPRO - Transmisión en Vivo</title>
    <style>
        :root {
            --fondo: #050505;
            --panel: #0f0f0f;
            --verde: #39ff14;
            --amarillo: #ffcc00;
            --cian: #00f3ff;
            --rojo: #ff0055;
            --texto: #ffffff;
        }
        body {
            background-color: var(--fondo);
            color: var(--texto);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header-transmision {
            text-align: center;
            margin-bottom: 20px;
        }
        .header-transmision h1 {
            color: var(--verde);
            margin: 0 0 5px 0;
            font-size: 28px;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(57, 255, 20, 0.4);
        }
        .en-directo {
            color: var(--verde);
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .bola-contenedor {
            background: radial-gradient(circle, #222 0%, #000 80%);
            border: 4px solid var(--verde);
            border-radius: 50%;
            width: 140px;
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(57, 255, 20, 0.3);
            margin-bottom: 25px;
            text-align: center;
            padding: 15px;
        }
        #ultimo-elemento-vivo {
            font-size: 20px;
            font-weight: 900;
            color: var(--amarillo);
            word-break: break-word;
            line-height: 1.2;
            text-align: center;
        }
        #aviso-estado {
            font-size: 14px;
            font-weight: bold;
            padding: 6px 15px;
            border-radius: 20px;
            margin-bottom: 15px;
            display: none;
            text-transform: uppercase;
        }
        .panel-tablero {
            background: var(--panel);
            border: 1px solid #222;
            border-radius: 12px;
            padding: 15px;
            width: 100%;
            max-width: 750px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }
        .info-tablero {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #888;
            margin-bottom: 10px;
            font-weight: bold;
        }
        #tablero-grid-jugador {
            display: grid;
            gap: 5px;
        }
        .celda-num {
            background: #111;
            color: #777;
            padding: 10px 4px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 13px;
            text-align: center;
            transition: all 0.2s ease;
        }
        .celda-num.marcada {
            background: var(--verde);
            color: #000;
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.5);
        }
        .celda-texto {
            background: #111;
            color: #888;
            padding: 10px 6px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 11px;
            text-align: center;
            text-transform: uppercase;
            border: 1px solid #222;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .celda-texto.marcada {
            background: var(--cian);
            color: #000;
            border-color: #fff;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }
    </style>
</head>
<body>

    <div class="header-transmision">
        <h1 id="titulo-juego-vivo">CONECTANDO...</h1>
        <div class="en-directo">🟢 TRANSMISIÓN EN DIRECTO</div>
    </div>

    <div id="aviso-estado"></div>

    <div class="bola-contenedor">
        <div id="ultimo-elemento-vivo">--</div>
    </div>

    <div class="panel-tablero">
        <div class="info-tablero">
            <span id="nombre-tablero-label">TABLERO GENERAL</span>
            <span id="contador-extraidas">EXTRAÍDAS: 0</span>
        </div>
        <div id="tablero-grid-jugador"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            authDomain: "juegos-16e17.firebaseapp.com",
            projectId: "juegos-16e17"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const miCarpeta = urlParams.get('p') || urlParams.get('proyecto') || 'gh';
        const juegoForzadoURL = urlParams.get('juego') || urlParams.get('s');

        const listasJuegos = {
            "mex": ["El Gallo", "El Diablito", "La Dama", "El Catrín", "El Paraguas", "El Sireno", "La Escalera", "La Botella", "El Barril", "El Árbol", "El Melón", "El Valiente", "El Gorrito", "La Muerte", "La Pera", "La Bandera", "El Bandolón", "El Violoncello", "La Garza", "Pájaro", "La Mano", "La Bota", "El Cotorro", "El Borracho", "El Negrito", "El Corazón", "La Sandía", "El Tambor", "El Músico", "El Arpa", "La Rana"],
            "lm": ["El Gallo", "El Diablito", "La Dama", "El Catrín", "El Paraguas", "La Sirena", "La Escalera", "La Botella", "El Barril", "El Árbol"],
            "abcdario": "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split(""),
            "comiveneca": ["Pabellón Criollo", "Arepa Pelúa", "Cachapa", "Hallaca", "Tequeños", "Asado Negro", "Patacón", "Pan de Jamón", "Empanada de Cazón", "Mundongo", "Chicha", "Cocada"],
            "comidas": ["Pizza", "Hamburguesa", "Tacos", "Sushi", "Paella", "Asado", "Pasta", "Hot Dog", "Empanadas", "Arepas", "Ceviche", "Pollo Frito"],
            "bebidas": ["Cerveza", "Tequila", "Ron", "Whisky", "Vodka", "Garrone", "Sangría", "Margarita", "Mojito", "Pisco", "Vino Tinto", "Champán"],
            "fiesta": ["Globos", "Pastel", "Piñata", "Música", "Confeti", "Regalos", "Luces", "Serpentina", "Bebidas", "Antifaces", "Velas", "Sorpresas"],
            "novelas": ["Rubí", "La Usurpadora", "Marimar", "Teresa", "Betty la Fea", "Rosalinda", "Pasión de Gavilanes", "El Senor de los Cielos", "Sin Senos no hay Paraíso", "Amor Real", "La Fea más Bella", "Cuidado con el Ángel"],
            "paises": ["Argentina", "Brasil", "Chile", "Colombia", "España", "México", "Perú", "Uruguay", "Venezuela", "Ecuador", "Bolivia", "Paraguay", "Costa Rica", "Panamá", "Rep. Dominicana", "Canadá", "EE.UU.", "Francia", "Italia", "Alemania"],
            "autos": ["Ferrari", "Porsche", "Lamborghini", "BMW", "Mercedes-Benz", "Audi", "Toyota", "Ford", "Chevrolet", "Nissan", "Honda", "Volkswagen"],
            "simpsons": ["Homero", "Marge", "Bart", "Lisa", "Maggie", "Ned Flanders", "Sr. Burns", "Smithers", "Moe", "Barney", "Krusty", "Milhouse"],
            "pitufos": ["Papá Pitufo", "Pitufina", "Pitufo Filósofo", "Pitufo Fortachón", "Pitufo Goloso", "Pitufo Bromista", "Pitufo Pintor", "Pitufo Poeta", "Pitufo Perezoso", "Pitufo Vanidoso", "Gargamel", "Azrael"],
            "romanos90": ["I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII","XIII","XIV","XV","XVI","XVII","XVIII","XIX","XX","XX1","XXII","XXIII","XXIV","XXV","XXVI","XXVII","XXVIII","XXIX","XXX","XXXI","XXXII","XXXIII","XXXIV","XXXV","XXXVI","XXXVII","XXXVIII","XXXIX","XL","XLI","XLII","XLIII","XLIV","XLV","XLVI","XLVII","XLVIII","XLIX","L","LI","LII","LIII","LIV","LV","LVI","LVII","LVIII","LIX","LX","LXI","LXII","LXIII","LXIV","LXV","LXVI","LXVII","LXVIII","LXIX","LXX","LXXI","LXXII","LXXIII","LXXIV","LXXV","LXXVI","LXXVII","LXXVIII","LXXIX","LXXX","LXXXI","LXXXII","LXXXIII","LXXXIV","LXXXV","LXXXVI","LXXXVII","LXXXVIII","LXXXIX","XC"],
            "pokemon": [
                "Bulbasaur", "Ivysaur", "Venusaur", "Charmander", "Charmeleon", "Charizard", "Squirtle", "Wartortle", "Blastoise", "Caterpie",
                "Metapod", "Butterfree", "Weedle", "Kakuna", "Beedrill", "Pidgey", "Pidgeotto", "Pidgeot", "Rattata", "Raticate",
                "Spearow", "Fearow", "Ekans", "Arbok", "Pikachu", "Raichu", "Sandshrew", "Sandslash", "Nidoran♀", "Nidorina",
                "Nidoqueen", "Nidoran♂", "Nidorino", "Nidoking", "Clefairy", "Clefable", "Vulpix", "Ninetales", "Jigglypuff", "Wigglytuff",
                "Zubat", "Golbat", "Oddish", "Gloom", "Vileplume", "Paras", "Parasect", "Venonat", "Venomoth", "Diglett",
                "Dugtrio", "Meowth", "Persian", "Psyduck", "Golduck", "Mankey", "Primeape", "Growlithe", "Arcanine", "Poliwag",
                "Poliwhirl", "Poliwrath", "Abra", "Kadabra", "Alakazam", "Machop", "Machoke", "Machamp", "Bellsprout", "Weepinbell",
                "Victreebel", "Tentacool", "Tentacruel", "Geodude", "Graveler", "Golem", "Ponyta", "Rapidash", "Slowpoke", "Slowbro",
                "Magnemite", "Magneton", "Farfetch'd", "Doduo", "Dodrio", "Seel", "Dewgong", "Grimer", "Muk", "Shellder",
                "Cloyster", "Gastly", "Haunter", "Gengar", "Onix", "Drowzee", "Hypno", "Krabby", "Kingler", "Voltorb",
                "Electrode", "Exeggcute", "Exeggutor", "Cubone", "Marowak", "Hitmonlee", "Hitmonchan", "Lickitung", "Koffing", "Weezing",
                "Rhyhorn", "Rhydon", "Chansey", "Tangela", "Kangaskhan", "Horsea", "Seadra", "Goldeen", "Seaking", "Staryu",
                "Starmie", "Mr. Mime", "Scyther", "Jynx", "Electabuzz", "Magmar", "Pinsir", "Tauros", "Magikarp", "Gyarados",
                "Lapras", "Ditto", "Eevee", "Vaporeon", "Jolteon", "Flareon", "Porygon", "Omanyte", "Omastar", "Kabuto",
                "Kabutops", "Aerodactyl", "Snorlax", "Articuno", "Zapdos", "Moltres", "Dratini", "Dragonair", "Dragonite", "Mewtwo", "Mew"
            ]
        };

        // Escuchamos el documento principal del proyecto para saber qué juego está activo en tiempo real
        const docRef = doc(db, "proyectos", miCarpeta);
        let unsubscribeJuego = null;

        onSnapshot(docRef, (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                const juegoActivo = juegoForzadoURL || data.juegoActivo || '50';

                // Escuchamos también el documento específico del juego activo si está guardado en una subcolección o ruta dedicada
                const juegoDocRef = doc(db, `proyectos/${miCarpeta}/juegosData`, juegoActivo);
                
                if (unsubscribeJuego) unsubscribeJuego(); // Limpiamos la escucha anterior

                unsubscribeJuego = onSnapshot(juegoDocRef, (juegoSnap) => {
                    let infoJuego = {};
                    if (juegoSnap.exists()) {
                        infoJuego = juegoSnap.data();
                    } else {
                        // Fallback por si los datos están directamente en el documento principal
                        infoJuego = (data.juegosData && data.juegosData[juegoActivo]) || 
                                      (data.sorteos && data.sorteos[juegoActivo]) || 
                                      data[juegoActivo] || 
                                      data;
                    }

                    const rawSacados = infoJuego.sacados || data.sacados || [];
                    const sacadosList = Array.isArray(rawSacados) ? rawSacados : Object.values(rawSacados);
                    const ultimoElemento = infoJuego.ultimo || data.ultimo || sacadosList[sacadosList.length - 1] || "--";

                    document.getElementById('titulo-juego-vivo').innerText = `SORTEO ${juegoActivo.toUpperCase()}`;
                    document.getElementById('ultimo-elemento-vivo').innerText = ultimoElemento;
                    document.getElementById('contador-extraidas').innerText = `EXTRAÍDAS: ${sacadosList.length}`;

                    renderizarTablero(juegoActivo, sacadosList);
                });

            } else {
                document.getElementById('titulo-juego-vivo').innerText = "PROYECTO NO ENCONTRADO";
            }
        }, (error) => {
            console.error("Error al escuchar Firestore:", error);
            document.getElementById('titulo-juego-vivo').innerText = "ERROR DE FIRESTORE";
        });

        function renderizarTablero(juego, sacados) {
            const grid = document.getElementById('tablero-grid-jugador');
            if (!grid) return;

            const juegoLower = String(juego).toLowerCase();

            // 1. Si es un juego basado en texto / cartas predefinidas
            if (listasJuegos[juegoLower]) {
                const elementos = listasJuegos[juegoLower];
                let html = '';
                elementos.forEach((el, index) => {
                    const marcado = sacados.includes(el);
                    const prefijoNum = juegoLower === 'pokemon' ? `#${index + 1} ` : '';
                    html += `<div class="celda-texto ${marcado ? 'marcada' : ''}">${prefijoNum}${el}</div>`;
                });
                grid.style.gridTemplateColumns = juegoLower === 'pokemon' ? "repeat(auto-fill, minmax(105px, 1fr))" : "repeat(auto-fill, minmax(115px, 1fr))";
                grid.innerHTML = html;
                return;
            }

            // 2. Si es un juego numérico tradicional
            let totalNums = 0;
            let columnas = 10;

            if (juegoLower === '50' || juegoLower === 'bingo50') { totalNums = 50; }
            else if (juegoLower === '72' || juegoLower === 'bingo72') { totalNums = 72; columnas = 9; }
            else if (juegoLower === '90' || juegoLower === 'bingo90') { totalNums = 90; }
            else if (juegoLower === '100' || juegoLower === 'bingo100') { totalNums = 100; }
            else if (juegoLower === 'bingocartones') { totalNums = 50; }
            else if (juegoLower === 'killernum') { totalNums = 50; }
            else if (juegoLower === 'eliminatorias') { totalNums = 30; columnas = 6; }

            if (totalNums > 0) {
                let htmlNum = '';
                for (let i = 1; i <= totalNums; i++) {
                    const marcado = sacados.includes(i) || sacados.includes(String(i));
                    const textoCelda = juegoLower === 'bingocartones' ? `#${i}` : (juegoLower === 'eliminatorias' ? `P${i}` : i);
                    htmlNum += `<div class="celda-num ${marcado ? 'marcada' : ''}">${textoCelda}</div>`;
                }
                grid.style.gridTemplateColumns = `repeat(${columnas}, 1fr)`;
                grid.innerHTML = htmlNum;
                return;
            }

            // 3. Juegos dinámicos personalizados de texto u otros
            let htmlDinamic = '';
            if (sacados.length === 0) {
                htmlDinamic = `<div style="grid-column: 1 / -1; text-align: center; color: #777; padding: 20px;">Esperando elementos...</div>`;
            } else {
                sacados.forEach((item) => {
                    htmlDinamic += `<div class="celda-texto marcada" style="font-size: 13px; padding: 12px;">${item}</div>`;
                });
            }
            grid.style.gridTemplateColumns = "repeat(auto-fill, minmax(140px, 1fr))";
            grid.innerHTML = htmlDinamic;
        }
    </script>
</body>
</html>
