    <style>
        :root {
            --fondo: #050505; --panel: #0f0f0f; --verde: #39ff14;
            --amarillo: #ffcc00; --cian: #00f3ff; --rosa: #ff00ff;
            --rojo: #ff0055; --texto: #ffffff;
        }

        body {
            background: radial-gradient(circle, #0f0f0f 0%, #000000 100%);
            color: var(--texto); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; box-sizing: border-box;
        }

        @keyframes pulseBall {
            0% { transform: scale(1); box-shadow: 0 0 20px rgba(57, 255, 20, 0.3); }
            50% { transform: scale(1.08); box-shadow: 0 0 45px rgba(57, 255, 20, 0.8); }
            100% { transform: scale(1); box-shadow: 0 0 20px rgba(57, 255, 20, 0.3); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animar-bola { animation: pulseBall 0.5s ease-in-out; }

        .btn-efecto { 
            background: #000; border: 1px solid #FF69B4; color: #FF69B4; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 11px; text-transform: uppercase; transition: all 0.3s ease; 
        }
        .btn-efecto:hover { border-color: var(--cian); color: var(--cian); box-shadow: 0 0 15px var(--cian); transform: translateY(-2px); }

        #capa-login-jugador {
            position: fixed; inset: 0; z-index: 99999; background: radial-gradient(circle, #111 0%, #000 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; animation: fadeIn 0.4s ease-out; padding: 20px; box-sizing: border-box;
        }

        .login-card {
            background: rgba(15, 15, 15, 0.95); border: 2px solid var(--verde); padding: 40px; border-radius: 20px; text-align: center; box-shadow: 0 0 35px rgba(57, 255, 20, 0.25); width: 100%; max-width: 320px; box-sizing: border-box; position: relative; backdrop-filter: blur(10px);
        }

        .login-card h1 { color: var(--verde); font-size: 18px; letter-spacing: 2px; margin-top: 0; margin-bottom: 25px; text-shadow: 0 0 10px rgba(57, 255, 20, 0.4); }

        .input-group { width: 100%; margin-bottom: 15px; }
        .input-group input, .input-group select {
            background: #000; border: 1px solid #333; color: #fff; padding: 12px; text-align: center; font-size: 15px; width: 100%; outline: none; border-radius: 8px; box-sizing: border-box; font-weight: bold; transition: 0.3s;
        }
        .input-group input:focus, .input-group select:focus { border-color: var(--verde); box-shadow: 0 0 12px rgba(57, 255, 20, 0.4); }

        .btn-ingresar {
            background: var(--verde); color: #000; border: none; width: 100%; padding: 12px; border-radius: 8px; font-weight: 900; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 0 15px rgba(57, 255, 20, 0.4); margin-top: 10px; transition: all 0.3s ease;
        }
        .btn-ingresar:hover { box-shadow: 0 0 25px rgba(57, 255, 20, 0.8); transform: scale(1.02); }
        #err-log-jugador, #err-reg-jugador { color: var(--rojo); margin-top: 15px; font-size: 11px; font-weight: bold; text-transform: uppercase; }

        #contenido-jugador {
            width: 100%; max-width: 1750px; display: none; flex-direction: column; align-items: center; animation: fadeIn 0.5s ease-out;
        }

        .header-top { 
            width: 100%; background: rgba(5, 5, 5, 0.8); backdrop-filter: blur(8px); border-bottom: 1px solid #151515; display: flex; justify-content: center; padding: 12px 0; margin-bottom: 20px; box-sizing: border-box; position: sticky; top: 0; z-index: 100;
        }
        .contenedor-central { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 1700px; padding: 0 15px; flex-wrap: wrap; gap: 10px; }

        .layout-principal {
            display: flex; gap: 20px; width: 100%; max-width: 1700px; box-sizing: border-box; align-items: flex-start; justify-content: center;
        }

        .sidebar-conectados {
            width: 330px; background: #080808; border: 1px solid #222; border-radius: 12px; padding: 15px; box-sizing: border-box; flex-shrink: 0; display: flex; flex-direction: column; gap: 15px;
        }
        .sidebar-conectados h3 { color: var(--verde); font-size: 12px; text-transform: uppercase; margin-top: 0; margin-bottom: 12px; border-bottom: 1px solid #222; padding-bottom: 8px; letter-spacing: 1px; }
        .sidebar-conectados h3.temporales-title { color: var(--amarillo); }
        #lista-conectados-jugador, #lista-temporales-jugador { display: flex; flex-direction: column; gap: 8px; max-height: 250px; overflow-y: auto; }
        .item-conectado, .item-temporal {
            display: flex; flex-direction: column; align-items: flex-start; gap: 6px; background: #111; padding: 10px; border-radius: 6px; font-size: 11px; border: 1px solid #1a1a1a; box-sizing: border-box; width: 100%;
        }
        .punto-online { width: 8px; height: 8px; background: var(--verde); border-radius: 50%; box-shadow: 0 0 6px var(--verde); flex-shrink: 0; }
        .punto-temporal { width: 8px; height: 8px; background: var(--amarillo); border-radius: 50%; box-shadow: 0 0 6px var(--amarillo); flex-shrink: 0; }

        .main-columna { width: 750px; display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }

        .sidebar-derecha {
            width: 650px; background: #080808; border: 1px solid #222; border-radius: 12px; padding: 15px; box-sizing: border-box; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 15px;
        }
        .sidebar-derecha h3 { color: var(--cian); font-size: 12px; text-transform: uppercase; margin-top: 0; margin-bottom: 0; border-bottom: 1px solid #222; padding-bottom: 8px; letter-spacing: 1px; width: 100%; text-align: center; }
        .contenedor-iframe-web { width: 100%; max-width: 650px; height: 486px; border: 1px solid #333; border-radius: 8px; overflow: hidden; background: #000; box-sizing: border-box; }
        .contenedor-iframe-web iframe { width: 100%; height: 100%; border: none; }

        .contenedor-iframe-bola { width: 100%; max-width: 325px; height: 385px; border: 1px solid #333; border-radius: 8px; overflow: hidden; background: #000; display: none; box-sizing: border-box; }
        .contenedor-iframe-bola iframe { width: 100%; height: 100%; border: none; }

        .header-transmision { text-align: center; margin-bottom: 20px; }
        .header-transmision h1 { color: var(--verde); margin: 0 0 5px 0; font-size: 26px; letter-spacing: 2px; text-shadow: 0 0 15px rgba(57, 255, 20, 0.4); }
        .en-directo { color: var(--verde); font-size: 11px; font-weight: bold; letter-spacing: 1px; }

        .bola-contenedor {
            background: radial-gradient(circle, #222 0%, #000 80%); border: 4px solid var(--verde); border-radius: 50%; width: 140px; height: 140px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 30px rgba(57, 255, 20, 0.3); margin-bottom: 15px; text-align: center; overflow: hidden; padding: 15px; box-sizing: border-box; transition: transform 0.3s ease;
        }

        #ultimo-elemento-vivo {
            font-size: 16px; font-weight: 900; color: var(--amarillo); word-break: break-word; line-height: 1.15; text-align: center; text-shadow: 0 0 12px rgba(255, 204, 0, 0.5); max-width: 100%; max-height: 100%; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical;
        }

        #contador-extraidas {
            background: rgba(15, 15, 15, 0.9); border: 1px solid #333; padding: 8px 18px; border-radius: 20px; font-weight: bold; font-size: 12px; color: var(--cian); margin-bottom: 25px; letter-spacing: 1px; box-shadow: 0 0 12px rgba(0, 243, 255, 0.15);
        }

        #tablero-grid-jugador {
            display: grid; gap: 6px; width: 100%; background: var(--panel); border: 1px solid #222; padding: 20px; border-radius: 14px; box-shadow: 0 8px 25px rgba(0,0,0,0.8); box-sizing: border-box; margin-bottom: 40px;
            max-height: 500px; overflow-y: auto;
        }

        .celda {
            background: #121212; color: #666; padding: 12px 4px; border-radius: 6px; text-align: center; font-weight: bold; font-size: 11px; border: 1px solid #1a1a1a; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; align-items: center; justify-content: center; text-transform: uppercase; cursor: pointer; box-sizing: border-box;
        }
        .celda:hover { border-color: var(--amarillo); color: var(--amarillo); }

        .marcada { background: var(--verde); color: #000; box-shadow: 0 0 12px rgba(57, 255, 20, 0.6); border-color: #fff; transform: scale(1.05); }
        .invertido-seleccionado { background: var(--amarillo); color: #000; border-color: #fff; box-shadow: 0 0 15px rgba(255, 204, 0, 0.7); }
        .invertido-ocupado { background: #220000; color: #666; border-color: #440000; cursor: not-allowed; opacity: 0.5; }
        .invertido-ocupado:hover { border-color: #440000; color: #666; }
        
        .badge-invertido {
            background: #1a1a1a; border: 1px dashed var(--amarillo); color: var(--amarillo); padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: 900; letter-spacing: 0.5px; width: 100%; box-sizing: border-box; white-space: normal; word-break: break-word; text-align: left;

        }

        }

        @media (max-width: 1400px) {
            .layout-principal { flex-direction: column; align-items: center; }
            .sidebar-conectados, .main-columna, .sidebar-derecha { width: 100%; max-width: 100%; }

</head>

    <div id="capa-login-jugador">

        async function registrarNuevoJugadorPublico() {
            const nick = document.getElementById('reg-nick').value.trim().toUpperCase();
            const pin = document.getElementById('reg-pin').value.trim();
            const sexo = document.getElementById('reg-sexo').value;
            const errReg = document.getElementById('err-reg-jugador');

            if (!nick || !pin) {
                errReg.innerText = "COMPLETA NICK Y PIN";
                return;
            }

            try {
                await setDoc(doc(db, "proyectos", miCarpeta, "registrados", nick), {
                    nick,
                    pin,
                    sexo,
                    genero: sexo === 'H' ? 'HOMBRE' : 'MUJER',
                    creado: Date.now()
                });

                alert("¡Registro creado con éxito! Ahora puedes iniciar sesión.");
                document.getElementById('reg-nick').value = '';
                document.getElementById('reg-pin').value = '';
                errReg.innerText = '';
                window.mostrarRegistroJugador(false);
            } catch (e) {
                errReg.innerText = "ERROR AL CREAR EL REGISTRO";
            }
        }

                                                                                    tieneSeleccion = true;
                                                                                    let t = dataTerna[nick].terna.split("-");
                                                                                    badgeHtml = `<span class="badge-invertido"><span class="${sacados.includes(t[0])?'num-inv-rojo':''}">${t[0]}</span>-<span class="${sacados.includes(t[1])?'num-inv-rojo':''}">${t[1]}</span>-<span class="${sacados.includes(t[2])?'num-inv-rojo':''}">${t[2]}</span></span>`;
                                                                                } else if (juegoLower === 'sumarversus' && dataVersus[nick]?.equipo) {
                                                                                    tieneSeleccion = true;
                                                                                    let eq = dataVersus[nick].equipo;
                                                                                    badgeHtml = `<span class="badge-invertido" style="color: ${eq==='A'?'var(--cian)':'var(--rosa)'};">EQUIPO ${eq}</span>`;
                                                                                } else if (['90', 'mex', 'pokemon', 'pais', 'autos', 'bebida', 'comidas', 'fiesta', 'pitufo', 'simpson', 'power'].includes(juegoLower)) {
                                                                                    let ds = juegoLower==='90'?data90:juegoLower==='mex'?dataMex:juegoLower==='pokemon'?dataPoke:juegoLower==='pais'?dataPais:juegoLower==='autos'?dataAutos:juegoLower==='bebida'?dataBebida:juegoLower==='comidas'?dataComidas:juegoLower==='fiesta'?dataFiesta:juegoLower==='pitufo'?dataPitufo:juegoLower==='simpson'?dataSimp:dataPow;
                                                                                    let cartas = (ds[nick] && Array.isArray(ds[nick].cartas)) ? ds[nick].cartas : [];
                                                                                    if (cartas.length > 0) {
                                                                                        tieneSeleccion = true;
                                                                                        badgeHtml = `<span class="badge-invertido">${cartas.map(c => `<span class="${sacados.includes(c)?'num-inv-rojo':''}">${c}</span>`).join(', ')}</span>`;
                                                                                    }
                                                                                }

                                                                                if (esOnline) {
                                                                                    totalOnline++;
                                                                                    htmlOnline += `<div class="item-conectado"><div style="display:flex; align-items:center; gap:6px; width:100%;"><span class="punto-online"></span><span style="font-weight:bold; color:#fff; word-break:break-all;">${nick}</span></div>${badgeHtml}</div>`;
                                                                                } else if (!esOnline && tieneSeleccion) {
                                                                                    totalTemporal++;
                                                                                    htmlTemporal += `<div class="item-temporal"><div style="display:flex; align-items:center; gap:6px; width:100%;"><span class="punto-temporal"></span><span style="font-weight:bold; color:var(--amarillo); word-break:break-all;">${nick}</span></div>${badgeHtml}</div>`;
                                                                                }
                                                                            });

                                                                            document.getElementById('count-conectados').innerText = totalOnline;
                                                                            document.getElementById('count-temporales-jugador').innerText = totalTemporal;
                                                                            if (contenedorLista) contenedorLista.innerHTML = htmlOnline || '<div style="color:#555; font-size:11px; text-align:center;">Nadie conectado</div>';
                                                                            if (contenedorTemporales) contenedorTemporales.innerHTML = htmlTemporal || '<div style="color:#555; font-size:11px; text-align:center;">Sin temporales</div>';
                                                                        });
                                                                    });
                                                                });
                                                            });
                                                        });
                                                    });
                                                });
                                            });
                                        });
                                    });
                                });
                            });
                        });
                    });
                });
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            escucharConectados();
            const nick = localStorage.getItem(`jugador_sesion_${miCarpeta}`);
            const token = localStorage.getItem(`jugador_token_${miCarpeta}`);
            if (nick && token) {
                document.getElementById('capa-login-jugador').style.display = 'none';
                document.getElementById('contenido-jugador').style.display = 'flex';
                registrarPresencia(nick);
                iniciarControlSesionUnica(nick, token);
                iniciarSincronizacion();
            }
        });

        window.cerrarSesionJugador = async (expulsado = false) => {
            const nick = localStorage.getItem(`jugador_sesion_${miCarpeta}`);
            if (nick && !expulsado) {
                await set(ref(rtdb, `proyectos/${miCarpeta}/presencia/${nick}`), { estado: 'offline', timestamp: Date.now() });
                ['90', 'inv', 'terna', 'sumarversus', 'mex', 'pokemon', 'pais', 'autos', 'bebida', 'comidas', 'fiesta', 'pitufo', 'simpson', 'power'].forEach(j => {
                    let ruta = j === 'inv' ? 'invertidosSeleccion' : j === 'terna' ? 'ternaSeleccion' : `${j}Seleccion`;
                    set(ref(rtdb, `proyectos/${miCarpeta}/${ruta}/${nick}`), null);
                });
                await set(ref(rtdb, `proyectos/${miCarpeta}/sesionesActivas/${nick}`), null);
            }
            localStorage.clear();
            location.reload();
        };

        async function intentarLoginJugador() {
            const nick = document.getElementById('login-nick').value.trim().toUpperCase();
            const pin = document.getElementById('login-pin').value.trim();
            const errLog = document.getElementById('err-log-jugador');
            if (!nick || !pin) { errLog.innerText = "INGRESA NICK Y PIN"; return; }

            try {
                const snap = await getDocs(collection(db, "proyectos", miCarpeta, "registrados"));
                let aut = false, genero = 'H';
                snap.forEach(d => { 
                    const ud = d.data();
                    if((ud.nick || d.id).trim().toUpperCase() === nick && String(ud.pin||'').trim() === pin) {
                        aut = true; genero = ud.sexo || 'H';
                    }
                });

                if(aut) {
                    const tokenUnico = 'tok_' + Math.random().toString(36.2) + Date.now();
                    await set(ref(rtdb, `proyectos/${miCarpeta}/sesionesActivas/${nick}`), tokenUnico);
                    localStorage.setItem(`jugador_sesion_${miCarpeta}`, nick);
                    localStorage.setItem(`jugador_genero_${miCarpeta}`, genero);
                    localStorage.setItem(`jugador_token_${miCarpeta}`, tokenUnico);
                    registrarPresencia(nick);

                    document.getElementById('capa-login-jugador').style.display = 'none';
                    document.getElementById('contenido-jugador').style.display = 'flex';
                    iniciarControlSesionUnica(nick, tokenUnico);
                    iniciarSincronizacion();
                } else errLog.innerText = "DATOS INCORRECTOS";
            } catch (e) { errLog.innerText = "ERROR DE CONEXIÓN"; }
        }

        document.getElementById('btn-login-jugador').onclick = intentarLoginJugador;
        document.getElementById('login-nick').onkeydown = (e) => { if (e.key === 'Enter') intentarLoginJugador(); };
        document.getElementById('login-pin').onkeydown = (e) => { if (e.key === 'Enter') intentarLoginJugador(); };

        function hablarTexto(texto) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(texto);
                u.lang = 'es-ES'; window.speechSynthesis.speak(u);
            }
        }

        const chatRef = ref(rtdb, `proyectos/${miCarpeta}/chat/mensajes`);
        function enviarMensajeChat() {
            const input = document.getElementById('input-chat');
            const texto = input.value.trim();
            if (!texto) return;
            push(chatRef, { nick: localStorage.getItem(`jugador_sesion_${miCarpeta}`), genero: localStorage.getItem(`jugador_genero_${miCarpeta}`) || 'H', texto, timestamp: Date.now() });
            input.value = '';
        }

        document.getElementById('btn-enviar-chat').onclick = enviarMensajeChat;
        document.getElementById('input-chat').onkeydown = (e) => { if (e.key === 'Enter') enviarMensajeChat(); };
        document.getElementById('btn-limpiar-chat').onclick = () => { document.getElementById('mensajes-chat').innerHTML = ""; };

        onChildAdded(chatRef, (snapshot) => {
            const msg = snapshot.val();
            if (!msg || (msg.timestamp && msg.timestamp < tiempoInicioCliente)) return;
            const chat = document.getElementById('mensajes-chat');
            chat.innerHTML += `<div><span style="color:${msg.genero === 'H' ? '#00f3ff' : '#ff00ff'}; font-weight:bold;">${msg.nick}:</span> ${msg.texto}</div>`;
            chat.scrollTop = chat.scrollHeight;
        });

        function iniciarSincronizacion() {
            const nickActual = localStorage.getItem(`jugador_sesion_${miCarpeta}`);
            
            if (nickActual) {
                onSnapshot(doc(db, "proyectos", miCarpeta, "registrados", nickActual), (docSnap) => {
                    if (!docSnap.exists()) {
                        alert("Tu cuenta ha sido eliminada por el administrador.");
                        window.cerrarSesionJugador(true);
                    }
                });
            }

            onSnapshot(doc(db, "proyectos", miCarpeta), (snap) => {
                if (!snap.exists()) return;
                const data = snap.data();
                
                if (data.urlXat) {
                    document.getElementById('wrapper-xat').style.display = 'block';
                    const iframe = document.getElementById('iframe-xat-jugador');
                    if (iframe.src !== data.urlXat) iframe.src = data.urlXat;
                } else document.getElementById('wrapper-xat').style.display = 'none';

                if (data.urlEnlaceBola) {
                    document.getElementById('wrapper-bola').style.display = 'block';
                    document.getElementById('titulo-panel-bola').style.display = 'block';
                    const iframe = document.getElementById('iframe-bola-jugador');
                    if (iframe.src !== data.urlEnlaceBola) iframe.src = data.urlEnlaceBola;
                } else {
                    document.getElementById('wrapper-bola').style.display = 'none';
                    document.getElementById('titulo-panel-bola').style.display = 'none';
                }

                maxSeleccionesGlobal = Number(data.maxSelecciones) || 2;
                const nuevoJuego = data.juegoActivo || '50';
                const cambioDeJuego = (juegoActualGlobal !== nuevoJuego);
                juegoActualGlobal = nuevoJuego;
                
                estado90Global = Boolean(data.estado90Comenzado);
                estadoInvertidosGlobal = Boolean(data.estadoInvertidosComenzado);
                estadoMexGlobal = Boolean(data.estadoMexComenzado);
                estadoPokemonGlobal = Boolean(data.estadoPokemonComenzado);
                estadoPaisGlobal = Boolean(data.estadoPaisComenzado) || Boolean(data.estadoPaisesComenzado);
                estadoAutosGlobal = Boolean(data.estadoAutosComenzado);
                estadoBebidaGlobal = Boolean(data.estadoBebidaComenzado);
                estadoComidasGlobal = Boolean(data.estadoComidasComenzado);
                estadoFiestaGlobal = Boolean(data.estadoFiestaComenzado);
                estadoPitufoGlobal = Boolean(data.estadoPitufoComenzado);
                estadoSimpsonGlobal = Boolean(data.estadoSimpsonComenzado);
                estadoPowerGlobal = Boolean(data.estadoPowerComenzado);
                estadoTernaGlobal = Boolean(data.estadoTernaComenzado);
                
                if (cambioDeJuego) escucharConectados();
                if (unsubscribeJuego) unsubscribeJuego();

                unsubscribeJuego = onValue(ref(rtdb, `proyectos/${miCarpeta}/sorteos/${juegoActualGlobal}`), (sSnap) => {
                    const info = sSnap.val() || {};
                    const sacados = Array.isArray(info.sacados) ? info.sacados : Object.values(info.sacados || {});
                    const ultimoVal = info.ultimo || sacados[sacados.length - 1] || "--";
                    
                    document.getElementById('titulo-juego-vivo').innerText = `JUEGO: ${juegoActualGlobal.toUpperCase()}`;
                    document.getElementById('ultimo-elemento-vivo').innerText = ultimoVal;
                    document.getElementById('contador-extraidas').innerText = `EXTRAÍDAS: ${sacados.length}`;
                    
                    if (ultimoVal !== ultimoValorAnterior && ultimoVal !== "--") {
                        ultimoValorAnterior = ultimoVal;
                        hablarTexto(String(ultimoVal));
                        const bola = document.getElementById('bola-animacion');
                        bola.classList.remove('animar-bola'); void bola.offsetWidth; bola.classList.add('animar-bola');
                    }

                    renderizarTablero(juegoActualGlobal, sacados);
                });
            });
        }

        function renderizarTablero(juego, sacados) {
            const grid = document.getElementById('tablero-grid-jugador');
            if (!grid) return;
            const juegoLower = String(juego).toLowerCase();
            const nickActual = localStorage.getItem(`jugador_sesion_${miCarpeta}`);
            let html = "";

            const juegosConSeleccion = ['90', 'inv', 'mex', 'pokemon', 'pais', 'autos', 'bebida', 'comidas', 'fiesta', 'pitufo', 'simpson', 'power', 'terna', 'sumarversus'];
            const estadosComenzados = {
                '90': estado90Global, 'inv': estadoInvertidosGlobal, 'mex': estadoMexGlobal, 'pokemon': estadoPokemonGlobal,
                'pais': estadoPaisGlobal, 'autos': estadoAutosGlobal, 'bebida': estadoBebidaGlobal, 'comidas': estadoComidasGlobal,
                'fiesta': estadoFiestaGlobal, 'pitufo': estadoPitufoGlobal, 'simpson': estadoSimpsonGlobal, 'power': estadoPowerGlobal,
                'terna': estadoTernaGlobal, 'sumarversus': false
            };

            if (juegoLower === 'sumarversus') {
                onValue(ref(rtdb, `proyectos/${miCarpeta}/sumarversusConfig`), (sConfig) => {
                    const bloqueado = Boolean(sConfig.val()?.bloqueado);
                    onValue(ref(rtdb, `proyectos/${miCarpeta}/sumarversusSeleccion`), (sAllSel) => {
                        if (juegoActualGlobal !== 'sumarversus') return;
                        let miEquipo = sAllSel.val()?.[nickActual]?.equipo;
                        onValue(ref(rtdb, `proyectos/${miCarpeta}/sorteos/sumarversus`), (sSorteo) => {
                            let pA = sSorteo.val()?.puntosA || 0, pB = sSorteo.val()?.puntosB || 0;
                            grid.style.gridTemplateColumns = "1fr";
                            grid.innerHTML = `
                                <div style="display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 10px;">
                                    <h2 style="color: var(--violeta); margin: 0; text-transform: uppercase;">SELECCIONA TU EQUIPO</h2>
                                    ${bloqueado ? '<div style="color: var(--rojo); font-weight: bold; font-size: 12px;">🔒 CAMBIO BLOQUEADO</div>' : ''}
                                    <div style="display: flex; gap: 20px; width: 100%; justify-content: center; flex-wrap: wrap;">
                                        <div onclick="window.seleccionarEquipoVersus('A', ${bloqueado})" style="flex: 1; min-width: 250px; background: ${miEquipo === 'A' ? 'var(--cian)' : '#121212'}; color: ${miEquipo === 'A' ? '#000' : '#fff'}; border: 2px solid var(--cian); padding: 30px; border-radius: 15px; text-align: center; cursor: pointer;">
                                            <h3 style="margin: 0 0 10px 0; font-size: 22px;">EQUIPO A</h3>
                                            <div style="font-size: 40px; font-weight: 900; margin-bottom: 10px;">${pA} PTS</div>
                                            <div>${miEquipo === 'A' ? '✓ TU EQUIPO' : 'UNIRSE'}</div>
                                        </div>
                                        <div onclick="window.seleccionarEquipoVersus('B', ${bloqueado})" style="flex: 1; min-width: 250px; background: ${miEquipo === 'B' ? 'var(--rosa)' : '#121212'}; color: ${miEquipo === 'B' ? '#000' : '#fff'}; border: 2px solid var(--rosa); padding: 30px; border-radius: 15px; text-align: center; cursor: pointer;">
                                            <h3 style="margin: 0 0 10px 0; font-size: 22px;">EQUIPO B</h3>
                                            <div style="font-size: 40px; font-weight: 900; margin-bottom: 10px;">${pB} PTS</div>
                                            <div>${miEquipo === 'B' ? '✓ TU EQUIPO' : 'UNIRSE'}</div>
                                        </div>
                                    </div>
                                </div>`;
                        }, { onlyOnce: true });
                    });
                });
                return;
            }

            if (juegosConSeleccion.includes(juegoLower) && !estadosComenzados[juegoLower]) {
                if (juegoLower === 'inv') {
                    onValue(ref(rtdb, `proyectos/${miCarpeta}/invertidosSeleccion`), (sAllSel) => {
                        if (juegoActualGlobal !== 'inv') return;
                        const allSel = sAllSel.val() || {};
                        let ocupados = {}; Object.keys(allSel).forEach(u => { if (allSel[u]?.par) ocupados[allSel[u].par] = u; });
                        let miPar = allSel[nickActual]?.par;
                        let gridHtml = "";

                        for (let i = 1; i <= 89; i++) {
                            let strI = i < 10 ? "0" + i : "" + i;
                            let invStr = strI.split("").reverse().join("");
                            let numInv = parseInt(invStr);
                            if (i !== numInv && i < numInv) {
                                let parStr = `${strI}-${invStr}`;
                                let ocupadoPor = ocupados[parStr];
                                let clase = miPar === parStr ? "invertido-seleccionado" : (ocupadoPor && ocupadoPor !== nickActual ? "invertido-ocupado" : "");
                                let attr = clase === "invertido-ocupado" ? `title="Ocupado"` : `onclick="window.seleccionarParInvertido('${parStr}')"`;
                                gridHtml += `<div class="celda ${clase}" ${attr} style="font-size: 13px; padding: 14px 4px; font-weight: 900;">${parStr}</div>`;
                            }
                        }
                        grid.style.gridTemplateColumns = "repeat(auto-fill, minmax(90px, 1fr))";
                        grid.innerHTML = gridHtml;
                    });
                    return;
                }

                if (juegoLower === 'terna') {
                    onValue(ref(rtdb, `proyectos/${miCarpeta}/ternaSeleccion`), (sAllSel) => {
                        if (juegoActualGlobal !== 'terna') return;
                        const allSel = sAllSel.val() || {};
                        let ocupados = {}; Object.keys(allSel).forEach(u => { if (allSel[u]?.terna) ocupados[allSel[u].terna] = u; });
                        let miTerna = allSel[nickActual]?.terna;
                        let gridHtml = "";

                        let ternas = [];
                        for (let i = 1; i <= 88; i += 3) {
                            let t1 = i < 10 ? "0" + i : "" + i;
                            let t2 = (i+1) < 10 ? "0" + (i+1) : "" + (i+1);
                            let t3 = (i+2) < 10 ? "0" + (i+2) : "" + (i+2);
                            ternas.push(`${t1}-${t2}-${t3}`);
                        }
                        ternas.forEach((ternaStr) => {
                            let ocupadoPor = ocupados[ternaStr];
                            let clase = miTerna === ternaStr ? "invertido-seleccionado" : (ocupadoPor && ocupadoPor !== nickActual ? "invertido-ocupado" : "");
                            let attr = clase === "invertido-ocupado" ? `title="Ocupado"` : `onclick="window.seleccionarTernaUnica('${ternaStr}')"`;
                            gridHtml += `<div class="celda ${clase}" ${attr} style="font-size: 11px; padding: 12px 4px; font-weight: 900;">${ternaStr}</div>`;
                        });
                        grid.style.gridTemplateColumns = "repeat(auto-fill, minmax(110px, 1fr))";
                        grid.innerHTML = gridHtml;
                    });
                    return;
                }

                onValue(ref(rtdb, `proyectos/${miCarpeta}/${juegoLower}Seleccion`), (sAllSel) => {
                    if (juegoActualGlobal !== juegoLower) return;
                    const allSel = sAllSel.val() || {};
                    let ocupados = {}; Object.keys(allSel).forEach(u => { if (Array.isArray(allSel[u]?.cartas)) allSel[u].cartas.forEach(c => ocupados[c] = u); });
                    let misCartas = Array.isArray(allSel[nickActual]?.cartas) ? allSel[nickActual].cartas : [];
                    let gridHtml = "";

                    listasJuegos[juegoLower].forEach((elem, index) => {
                        let ocupadoPor = ocupados[elem];
                        let clase = misCartas.includes(elem) ? "invertido-seleccionado" : (ocupadoPor && ocupadoPor !== nickActual ? "invertido-ocupado" : "");
                        let attr = clase === "invertido-ocupado" ? `title="Ocupado"` : `onclick="window.seleccionarCartaGenerica('${juegoLower}', '${elem}')"`;
                        gridHtml += `<div class="celda ${clase}" ${attr} style="font-size: 10px; padding: 10px 2px; font-weight: 900;">${juegoLower==='90'?elem:'#'+(index+1)+' '+elem}</div>`;
                    });
                    grid.style.gridTemplateColumns = juegoLower==='90' ? "repeat(10, 1fr)" : "repeat(auto-fill, minmax(110px, 1fr))";
                    grid.innerHTML = gridHtml;
                });
                return;
            }

            let totalNums = 90, columnas = 10;
            if (juegoLower === '72') { totalNums = 72; columnas = 9; }
            else if (juegoLower === '100') { totalNums = 100; }

            grid.style.gridTemplateColumns = `repeat(${columnas}, 1fr)`;
            for(let i=1; i<=totalNums; i++) {
                const esta = sacados.includes(String(i)) || sacados.includes(Number(i));
                html += `<div class="celda ${esta ? 'marcada' : ''}">${i}</div>`;
            }
            grid.innerHTML = html;
        }

        window.seleccionarParInvertido = (par) => {
            const nick = localStorage.getItem(`jugador_sesion_${miCarpeta}`);
            onValue(ref(rtdb, `proyectos/${miCarpeta}/invertidosSeleccion`), (snap) => {
                let ocupado = false;
                Object.keys(snap.val() || {}).forEach(u => { if (u !== nick && snap.val()[u]?.par === par) ocupado = true; });
                if (ocupado) { alert("¡Ocupado!"); return; }
                const refUser = ref(rtdb, `proyectos/${miCarpeta}/invertidosSeleccion/${nick}`);
                onValue(refUser, (s) => set(refUser, s.val()?.par === par ? null : { par, timestamp: Date.now() }), { onlyOnce: true });
            }, { onlyOnce: true });
        };

        window.seleccionarTernaUnica = (terna) => {
            const nick = localStorage.getItem(`jugador_sesion_${miCarpeta}`);
            onValue(ref(rtdb, `proyectos/${miCarpeta}/ternaSeleccion`), (snap) => {
                let ocupado = false;
                Object.keys(snap.val() || {}).forEach(u => { if (u !== nick && snap.val()[u]?.terna === terna) ocupado = true; });
                if (ocupado) { alert("¡Ocupado!"); return; }
                const refUser = ref(rtdb, `proyectos/${miCarpeta}/ternaSeleccion/${nick}`);
                onValue(refUser, (s) => set(refUser, s.val()?.terna === terna ? null : { terna, timestamp: Date.now() }), { onlyOnce: true });
            }, { onlyOnce: true });
        };

        window.seleccionarEquipoVersus = (eq, bloqueado) => {
            if (bloqueado) { alert("Bloqueado por admin."); return; }
            set(ref(rtdb, `proyectos/${miCarpeta}/sumarversusSeleccion/${localStorage.getItem(`jugador_sesion_${miCarpeta}`)}`), { equipo: eq, timestamp: Date.now() });
        };

        window.seleccionarCartaGenerica = (juego, carta) => {
            const nick = localStorage.getItem(`jugador_sesion_${miCarpeta}`);
            onValue(ref(rtdb, `proyectos/${miCarpeta}/${juego}Seleccion`), (snap) => {
                let ocupada = false;
                Object.keys(snap.val() || {}).forEach(u => { if (u !== nick && Array.isArray(snap.val()[u]?.cartas) && snap.val()[u].cartas.includes(carta)) ocupada = true; });
                if (ocupada) { alert("¡Ocupada!"); return; }
                const refSel = ref(rtdb, `proyectos/${miCarpeta}/${juego}Seleccion/${nick}/cartas`);
                onValue(refSel, (s) => {
                    let mis = s.val() || []; if (!Array.isArray(mis)) mis = Object.values(mis);
                    if (mis.includes(carta)) mis = mis.filter(c => c !== carta);
                    else {
                        if (mis.length >= maxSeleccionesGlobal) { alert(`Máximo ${maxSeleccionesGlobal} opciones.`); return; }
                        mis.push(carta);
                    }
                    set(ref(rtdb, `proyectos/${miCarpeta}/${juego}Seleccion/${nick}`), mis.length > 0 ? { cartas: mis, timestamp: Date.now() } : null);
                }, { onlyOnce: true });
            }, { onlyOnce: true });
        };
    </script>
</body>
</html>
