<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PERLANEGRAGAMES - Transmisión en Vivo</title>

    <style>
        :root {
            --fondo: #050505;
            --panel: #0f0f0f;
            --verde: #39ff14;
            --amarillo: #ffcc00;
            --cian: #00f3ff;
            --rosa: #ff00ff;
            --rojo: #ff0055;
            --texto: #ffffff;
        }

        body {
            background: radial-gradient(circle, #0f0f0f 0%, #000000 100%);
            color: var(--texto);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        @keyframes pulseBall {
            0% { transform: scale(1); box-shadow: 0 0 20px rgba(57, 255, 20, 0.3); }
            50% { transform: scale(1.08); box-shadow: 0 0 45px rgba(57, 255, 20, 0.8); }
            100% { transform: scale(1); box-shadow: 0 0 20px rgba(57, 255, 20, 0.3); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animar-bola { animation: pulseBall 0.5s ease-in-out; }

        .btn-efecto { 
            background: #000; border: 1px solid #FF69B4; color: #FF69B4; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 11px; text-transform: uppercase; transition: all 0.3s ease; 
        }
        .btn-efecto:hover { border-color: var(--cian); color: var(--cian); box-shadow: 0 0 15px var(--cian); transform: translateY(-2px); }

        #capa-login-jugador {
            position: fixed; inset: 0; z-index: 99999; background: radial-gradient(circle, #111 0%, #000 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; animation: fadeIn 0.4s ease-out; padding: 20px; box-sizing: border-box;
        }

        .login-card {
            background: rgba(15, 15, 15, 0.95); border: 2px solid var(--verde); padding: 40px; border-radius: 20px; text-align: center; box-shadow: 0 0 35px rgba(57, 255, 20, 0.25); width: 100%; max-width: 320px; box-sizing: border-box; position: relative; backdrop-filter: blur(10px);
        }

        .login-card h1 { color: var(--verde); font-size: 18px; letter-spacing: 2px; margin-top: 0; margin-bottom: 25px; text-shadow: 0 0 10px rgba(57, 255, 20, 0.4); }

        .input-group { width: 100%; margin-bottom: 15px; }
        .input-group input {
            background: #000; border: 1px solid #333; color: #fff; padding: 12px; text-align: center; font-size: 15px; width: 100%; outline: none; border-radius: 8px; box-sizing: border-box; font-weight: bold; transition: 0.3s;
        }
        .input-group input:focus { border-color: var(--verde); box-shadow: 0 0 12px rgba(57, 255, 20, 0.4); }

        .btn-ingresar {
            background: var(--verde); color: #000; border: none; width: 100%; padding: 12px; border-radius: 8px; font-weight: 900; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 0 15px rgba(57, 255, 20, 0.4); margin-top: 10px; transition: all 0.3s ease;
        }
        .btn-ingresar:hover { box-shadow: 0 0 25px rgba(57, 255, 20, 0.8); transform: scale(1.02); }
        #err-log-jugador { color: var(--rojo); margin-top: 15px; font-size: 11px; font-weight: bold; text-transform: uppercase; }

        #contenido-jugador {
            width: 100%; max-width: 1750px; display: none; flex-direction: column; align-items: center; animation: fadeIn 0.5s ease-out;
        }

        .header-top { 
            width: 100%; background: rgba(5, 5, 5, 0.8); backdrop-filter: blur(8px); border-bottom: 1px solid #151515; display: flex; justify-content: center; padding: 12px 0; margin-bottom: 20px; box-sizing: border-box; position: sticky; top: 0; z-index: 100;
        }
        .contenedor-central { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 1700px; padding: 0 15px; flex-wrap: wrap; gap: 10px; }

        .layout-principal {
            display: flex; gap: 20px; width: 100%; max-width: 1700px; box-sizing: border-box; align-items: flex-start; justify-content: center;
        }

        .sidebar-conectados {
            width: 330px; background: #080808; border: 1px solid #222; border-radius: 12px; padding: 15px; box-sizing: border-box; flex-shrink: 0; display: flex; flex-direction: column; gap: 15px;
        }
        .sidebar-conectados h3 {
            color: var(--verde); font-size: 12px; text-transform: uppercase; margin-top: 0; margin-bottom: 12px; border-bottom: 1px solid #222; padding-bottom: 8px; letter-spacing: 1px;
        }
        .sidebar-conectados h3.temporales-title {
            color: var(--amarillo);
        }
        #lista-conectados-jugador, #lista-temporales-jugador { display: flex; flex-direction: column; gap: 8px; max-height: 250px; overflow-y: auto; }
        .item-conectado, .item-temporal {
            display: flex; flex-direction: column; align-items: flex-start; gap: 6px; background: #111; padding: 10px; border-radius: 6px; font-size: 11px; border: 1px solid #1a1a1a; box-sizing: border-box; width: 100%;
        }
        .punto-online { width: 8px; height: 8px; background: var(--verde); border-radius: 50%; box-shadow: 0 0 6px var(--verde); flex-shrink: 0; }
        .punto-temporal { width: 8px; height: 8px; background: var(--amarillo); border-radius: 50%; box-shadow: 0 0 6px var(--amarillo); flex-shrink: 0; }

        .main-columna { width: 750px; display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }

        .sidebar-derecha {
            width: 650px; background: #080808; border: 1px solid #222; border-radius: 12px; padding: 15px; box-sizing: border-box; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 15px;
        }
        .sidebar-derecha h3 {
            color: var(--cian); font-size: 12px; text-transform: uppercase; margin-top: 0; margin-bottom: 0; border-bottom: 1px solid #222; padding-bottom: 8px; letter-spacing: 1px; width: 100%; text-align: center;
        }
        .contenedor-iframe-web { width: 100%; max-width: 650px; height: 486px; border: 1px solid #333; border-radius: 8px; overflow: hidden; background: #000; box-sizing: border-box; }
        .contenedor-iframe-web iframe { width: 100%; height: 100%; border: none; }

        .contenedor-iframe-bola { width: 100%; max-width: 325px; height: 385px; border: 1px solid #333; border-radius: 8px; overflow: hidden; background: #000; display: none; box-sizing: border-box; }
        .contenedor-iframe-bola iframe { width: 100%; height: 100%; border: none; }

        .header-transmision { text-align: center; margin-bottom: 20px; }
        .header-transmision h1 { color: var(--verde); margin: 0 0 5px 0; font-size: 26px; letter-spacing: 2px; text-shadow: 0 0 15px rgba(57, 255, 20, 0.4); }
        .en-directo { color: var(--verde); font-size: 11px; font-weight: bold; letter-spacing: 1px; }

        .bola-contenedor {
            background: radial-gradient(circle, #222 0%, #000 80%); border: 4px solid var(--verde); border-radius: 50%; width: 140px; height: 140px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 30px rgba(57, 255, 20, 0.3); margin-bottom: 15px; text-align: center; overflow: hidden; padding: 15px; box-sizing: border-box; transition: transform 0.3s ease;
        }

        #ultimo-elemento-vivo {
            font-size: 16px; font-weight: 900; color: var(--amarillo); word-break: break-word; line-height: 1.15; text-align: center; text-shadow: 0 0 12px rgba(255, 204, 0, 0.5); max-width: 100%; max-height: 100%; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical;
        }

        #contador-extraidas {
            background: rgba(15, 15, 15, 0.9); border: 1px solid #333; padding: 8px 18px; border-radius: 20px; font-weight: bold; font-size: 12px; color: var(--cian); margin-bottom: 25px; letter-spacing: 1px; box-shadow: 0 0 12px rgba(0, 243, 255, 0.15);
        }

        #tablero-grid-jugador {
            display: grid; gap: 6px; width: 100%; background: var(--panel); border: 1px solid #222; padding: 20px; border-radius: 14px; box-shadow: 0 8px 25px rgba(0,0,0,0.8); box-sizing: border-box; margin-bottom: 40px;
            max-height: 500px; overflow-y: auto;
        }

        .celda {
            background: #121212; color: #666; padding: 12px 4px; border-radius: 6px; text-align: center; font-weight: bold; font-size: 11px; border: 1px solid #1a1a1a; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; align-items: center; justify-content: center; text-transform: uppercase; cursor: pointer; box-sizing: border-box;
        }
        .celda:hover { border-color: var(--amarillo); color: var(--amarillo); }

        .marcada {
            background: var(--verde); color: #000; box-shadow: 0 0 12px rgba(57, 255, 20, 0.6); border-color: #fff; transform: scale(1.05);
        }
        .invertido-seleccionado {
            background: var(--amarillo); color: #000; border-color: #fff; box-shadow: 0 0 15px rgba(255, 204, 0, 0.7);
        }
        .invertido-ocupado {
            background: #220000; color: #666; border-color: #440000; cursor: not-allowed; opacity: 0.5;
        }
        .invertido-ocupado:hover { border-color: #440000; color: #666; }
        
        .badge-invertido {
            background: #1a1a1a; border: 1px dashed var(--amarillo); color: var(--amarillo); padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: 900; letter-spacing: 0.5px; width: 100%; box-sizing: border-box; white-space: normal; word-break: break-word; text-align: left;
        }
        .num-inv-rojo { color: var(--rojo) !important; text-decoration: line-through; }

        /* MODO MÓVIL FORZADO O RESPONSIVO AUTOMÁTICO */
        body.modo-movil .layout-principal {
            flex-direction: column !important;
            align-items: center !important;
        }
        body.modo-movil .sidebar-conectados,
        body.modo-movil .main-columna,
        body.modo-movil .sidebar-derecha {
            width: 100% !important;
            max-width: 100% !important;
        }
        body.modo-movil .contenedor-iframe-web {
            height: 300px !important;
        }

        @media (max-width: 1400px) {
            .layout-principal {
                flex-direction: column;
                align-items: center;
            }
            .sidebar-conectados, .main-columna, .sidebar-derecha {
                width: 100%;
                max-width: 100%;
            }
            .contenedor-iframe-web {
                height: 350px;
            }
        }

</head>

        function configurarAutoLiberacion(nick) {
            const refInvUser = ref(rtdb, `proyectos/${miCarpeta}/invertidosSeleccion/${nick}`);
            onDisconnect(refInvUser).remove();

            const refTernaUser = ref(rtdb, `proyectos/${miCarpeta}/ternaSeleccion/${nick}`);
            onDisconnect(refTernaUser).remove();

            ['mex', 'pokemon', 'pais', 'autos', 'bebida', 'comidas', 'fiesta', 'pitufo', 'simpson', 'power'].forEach(j => {

            });
        }

            const tokenRef = ref(rtdb, `proyectos/${miCarpeta}/sesionesActivas/${nick}`);

                const tokenRemoto = snapshot.val();
                if (tokenRemoto && tokenRemoto !== tokenLocal) {
                    alert("Tu sesión ha sido abierta en otro dispositivo o navegador.");
                    window.cerrarSesionJugador(true); 
                }
            });
        }

            const estadoRef = ref(rtdb, `proyectos/${miCarpeta}/presencia/${nick}`);

            onDisconnect(estadoRef).set({ estado: 'offline', timestamp: Date.now() });

            configurarAutoLiberacion(nick);
        }

        function escucharConectados() {

                const dataPresencia = snapshot.val() || {};
                
                onValue(ref(rtdb, `proyectos/${miCarpeta}/invertidosSeleccion`), (snapInv) => {

                                                                                if (cartasUser.length > 0) {

                                                                                htmlTemporal += `

                                                                        if (contadorTemporalesElem) contadorTemporalesElem.innerText = totalTemporal;

        window.addEventListener('DOMContentLoaded', () => {
            escucharConectados();
            const nickGuardado = localStorage.getItem(`jugador_sesion_${miCarpeta}`);
            const tokenGuardado = localStorage.getItem(`jugador_token_${miCarpeta}`);
            if (nickGuardado && tokenGuardado) {
                document.getElementById('capa-login-jugador').style.display = 'none';
                document.getElementById('contenido-jugador').style.display = 'flex';
                registrarPresencia(nickGuardado);
                iniciarControlSesionUnica(nickGuardado, tokenGuardado);
                iniciarSincronizacion();
            }
        });

        window.cerrarSesionJugador = async (expulsadoPorOtro = false) => {
            const nickGuardado = localStorage.getItem(`jugador_sesion_${miCarpeta}`);
            if (nickGuardado && !expulsadoPorOtro) {
                const estadoRef = ref(rtdb, `proyectos/${miCarpeta}/presencia/${nickGuardado}`);
                await set(estadoRef, { estado: 'offline', timestamp: Date.now() });

                await set(ref(rtdb, `proyectos/${miCarpeta}/invertidosSeleccion/${nickGuardado}`), null);
                await set(ref(rtdb, `proyectos/${miCarpeta}/ternaSeleccion/${nickGuardado}`), null);
                await set(ref(rtdb, `proyectos/${miCarpeta}/sumarversusSeleccion/${nickGuardado}`), null);
                ['mex', 'pokemon', 'pais', 'autos', 'bebida', 'comidas', 'fiesta', 'pitufo', 'simpson', 'power'].forEach(j => {
                    set(ref(rtdb, `proyectos/${miCarpeta}/${j}Seleccion/${nickGuardado}`), null);
                });
                
                await set(ref(rtdb, `proyectos/${miCarpeta}/sesionesActivas/${nickGuardado}`), null);
            }
            localStorage.removeItem(`jugador_sesion_${miCarpeta}`);
            localStorage.removeItem(`jugador_genero_${miCarpeta}`);
            localStorage.removeItem(`jugador_token_${miCarpeta}`);
            location.reload();
        };

        async function intentarLoginJugador() {
            const nick = document.getElementById('login-nick').value.trim().toLowerCase();
            const pin = document.getElementById('login-pin').value.trim();
            const errLog = document.getElementById('err-log-jugador');

            if (!nick || !pin) {
                errLog.innerText = "INGRESA NICK Y PIN";
                return;
            }

            try {
                const regRef = collection(db, "proyectos", miCarpeta, "registrados");
                const snap = await getDocs(regRef);
                
                let aut = false;
                let genero = 'H';
                snap.forEach(d => { 
                    const userData = d.data();
                    const nickDb = (userData.nick || d.id).trim().toLowerCase();
                    const pinDb = String(userData.pin || '').trim();
                    if(nickDb === nick && pinDb === pin) {
                        aut = true;
                        genero = userData.sexo || 'H';
                    }
                });

                if(aut) {
                    const tokenUnico = 'tok_' + Math.random().toString(36.2) + Date.now();
                    await set(ref(rtdb, `proyectos/${miCarpeta}/sesionesActivas/${nick}`), tokenUnico);

                    localStorage.setItem(`jugador_sesion_${miCarpeta}`, nick);
                    localStorage.setItem(`jugador_genero_${miCarpeta}`, genero);
                    localStorage.setItem(`jugador_token_${miCarpeta}`, tokenUnico);
                    
                    registrarPresencia(nick);

                    document.getElementById('capa-login-jugador').style.display = 'none';
                    document.getElementById('contenido-jugador').style.display = 'flex';
                    iniciarControlSesionUnica(nick, tokenUnico);
                    iniciarSincronizacion();
                } else {
                    errLog.innerText = "DATOS INCORRECTOS";
                }
            } catch (e) {
                errLog.innerText = "ERROR DE CONEXIÓN";
            }
        }

        document.getElementById('btn-login-jugador').onclick = intentarLoginJugador;

        document.getElementById('login-nick').onkeydown = (e) => { if (e.key === 'Enter') intentarLoginJugador(); };
        document.getElementById('login-pin').onkeydown = (e) => { if (e.key === 'Enter') intentarLoginJugador(); };

        function hablarTexto(texto) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(texto);
                utterance.lang = 'es-ES';
                utterance.rate = 1.0;
                utterance.pitch = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        const chatRef = ref(rtdb, `proyectos/${miCarpeta}/chat/mensajes`);

        function enviarMensajeChat() {
            const input = document.getElementById('input-chat');
            const texto = input.value.trim();
            if (!texto) return;

            push(chatRef, {
                nick: localStorage.getItem(`jugador_sesion_${miCarpeta}`),
                genero: localStorage.getItem(`jugador_genero_${miCarpeta}`) || 'H',
                texto: texto,
                timestamp: Date.now()
            });
            input.value = '';
        }

        document.getElementById('btn-enviar-chat').onclick = enviarMensajeChat;

        document.getElementById('input-chat').onkeydown = (e) => {
            if (e.key === 'Enter') {
                enviarMensajeChat();
            }
        };

        document.getElementById('btn-limpiar-chat').onclick = () => {
            document.getElementById('mensajes-chat').innerHTML = "";
        };

        onChildAdded(chatRef, (snapshot) => {
            const msg = snapshot.val();
            if (!msg) return;
            if (msg.timestamp && msg.timestamp < tiempoInicioCliente) return;

            const chat = document.getElementById('mensajes-chat');
            const color = (msg.genero === 'H') ? '#00f3ff' : '#ff00ff';
            chat.innerHTML += `<div><span style="color:${color}; font-weight:bold;">${msg.nick}:</span> ${msg.texto}</div>`;
            chat.scrollTop = chat.scrollHeight;
        });

        function iniciarSincronizacion() {
            onSnapshot(doc(db, "proyectos", miCarpeta), (snap) => {
                if (!snap.exists()) return;
                const data = snap.data();
                
                if (data.urlXat) {
                    const wrapperXat = document.getElementById('wrapper-xat');
                    const iframeXat = document.getElementById('iframe-xat-jugador');
                    if (wrapperXat && iframeXat) {
                        wrapperXat.style.display = 'block';
                        if (iframeXat.src !== data.urlXat) iframeXat.src = data.urlXat;
                    }
                } else {
                    const wrapperXat = document.getElementById('wrapper-xat');
                    if (wrapperXat) wrapperXat.style.display = 'none';
                }

                if (data.urlEnlaceBola) {
                    const wrapperBola = document.getElementById('wrapper-bola');
                    const iframeBola = document.getElementById('iframe-bola-jugador');
                    const tituloBola = document.getElementById('titulo-panel-bola');
                    if (wrapperBola && iframeBola) {
                        wrapperBola.style.display = 'block';
                        if(tituloBola) tituloBola.style.display = 'block';
                        if (iframeBola.src !== data.urlEnlaceBola) iframeBola.src = data.urlEnlaceBola;
                    }
                } else {
                    const wrapperBola = document.getElementById('wrapper-bola');
                    const tituloBola = document.getElementById('titulo-panel-bola');
                    if (wrapperBola) wrapperBola.style.display = 'none';
                    if(tituloBola) tituloBola.style.display = 'none';
                }

                maxSeleccionesGlobal = Number(data.maxSelecciones) || 2;

                const nuevoJuego = data.juegoActivo || '50';
                const cambioDeJuego = (juegoActualGlobal !== nuevoJuego);
                juegoActualGlobal = nuevoJuego;
                
                estadoInvertidosGlobal = Boolean(data.estadoInvertidosComenzado);
                estadoMexGlobal = Boolean(data.estadoMexComenzado);
                estadoPokemonGlobal = Boolean(data.estadoPokemonComenzado);
                estadoPaisGlobal = Boolean(data.estadoPaisComenzado) || Boolean(data.estadoPaisesComenzado);
                estadoAutosGlobal = Boolean(data.estadoAutosComenzado);
                estadoBebidaGlobal = Boolean(data.estadoBebidaComenzado);
                estadoComidasGlobal = Boolean(data.estadoComidasComenzado);
                estadoFiestaGlobal = Boolean(data.estadoFiestaComenzado);
                estadoPitufoGlobal = Boolean(data.estadoPitufoComenzado);
                estadoSimpsonGlobal = Boolean(data.estadoSimpsonComenzado);
                estadoPowerGlobal = Boolean(data.estadoPowerComenzado);
                estadoTernaGlobal = Boolean(data.estadoTernaComenzado);
                
                if (cambioDeJuego) {
                    escucharConectados();
                }

                if (unsubscribeJuego) unsubscribeJuego();

                unsubscribeJuego = onValue(ref(rtdb, `proyectos/${miCarpeta}/sorteos/${juegoActualGlobal}`), (sSnap) => {
                    const info = sSnap.val() || {};
                    const rawSalidos = info.sacados || [];
                    const sacados = Array.isArray(rawSalidos) ? rawSalidos : Object.values(rawSalidos);
                    const ultimoVal = info.ultimo || sacados[sacados.length - 1] || "--";
                    
                    document.getElementById('titulo-juego-vivo').innerText = `JUEGO: ${juegoActualGlobal.toUpperCase()}`;
                    document.getElementById('ultimo-elemento-vivo').innerText = ultimoVal;
                    document.getElementById('contador-extraidas').innerText = `EXTRAÍDAS: ${sacados.length}`;
                    
                    if (ultimoVal !== ultimoValorAnterior && ultimoVal !== "--") {
                        ultimoValorAnterior = ultimoVal;
                        hablarTexto(String(ultimoVal));

                        const bola = document.getElementById('bola-animacion');
                        bola.classList.remove('animar-bola');
                        void bola.offsetWidth; 
                        bola.classList.add('animar-bola');
                    }

                    renderizarTablero(juegoActualGlobal, sacados);
                });
            });
        }

        function renderizarTablero(juego, sacados) {
            const grid = document.getElementById('tablero-grid-jugador');
            if (!grid) return;
            const juegoLower = String(juego).toLowerCase();
            let html = "";

            const juegosConSeleccion = ['inv', 'mex', 'pokemon', 'pais', 'autos', 'bebida', 'comidas', 'fiesta', 'pitufo', 'simpson', 'power', 'terna', 'sumarversus'];
            const estadosComenzados = {
                'inv': estadoInvertidosGlobal,
                'mex': estadoMexGlobal, 'pokemon': estadoPokemonGlobal, 'pais': estadoPaisGlobal,
                'autos': estadoAutosGlobal, 'bebida': estadoBebidaGlobal, 'comidas': estadoComidasGlobal,
                'fiesta': estadoFiestaGlobal, 'pitufo': estadoPitufoGlobal, 'simpson': estadoSimpsonGlobal,
                'power': estadoPowerGlobal, 'terna': estadoTernaGlobal, 'sumarversus': false
            };

            const nickActual = localStorage.getItem(`jugador_sesion_${miCarpeta}`);

            if (juegoLower === 'sumarversus') {
                onValue(ref(rtdb, `proyectos/${miCarpeta}/sumarversusConfig`), (sConfig) => {
                    const configData = sConfig.val() || {};
                    const estaBloqueado = Boolean(configData.bloqueado);

                    onValue(ref(rtdb, `proyectos/${miCarpeta}/sumarversusSeleccion`), (sAllSel) => {
                        if (juegoActualGlobal !== 'sumarversus') return;
                        const allSelections = sAllSel.val() || {};
                        let miEquipo = allSelections[nickActual] ? allSelections[nickActual].equipo : null;

                        onValue(ref(rtdb, `proyectos/${miCarpeta}/sorteos/sumarversus`), (sSorteo) => {
                            const infoSorteo = sSorteo.val() || {};
                            let pA = infoSorteo.puntosA || 0;
                            let pB = infoSorteo.puntosB || 0;

                            grid.style.gridTemplateColumns = "1fr";
                            grid.innerHTML = `
                                <div style="display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 10px;">
                                    <h2 style="color: var(--violeta); margin: 0; text-transform: uppercase;">SELECCIONA TU EQUIPO</h2>
                                    ${estaBloqueado ? '<div style="color: var(--rojo); font-weight: bold; font-size: 12px;">🔒 CAMBIO DE EQUIPO BLOQUEADO POR EL ADMINISTRADOR</div>' : ''}
                                    
                                    <div style="display: flex; gap: 20px; width: 100%; justify-content: center; flex-wrap: wrap;">
                                        <div onclick="window.seleccionarEquipoVersus('A', ${estaBloqueado})" style="flex: 1; min-width: 250px; background: ${miEquipo === 'A' ? 'var(--cian)' : '#121212'}; color: ${miEquipo === 'A' ? '#000' : '#fff'}; border: 2px solid var(--cian); padding: 30px; border-radius: 15px; text-align: center; cursor: pointer; transition: 0.3s; box-shadow: ${miEquipo === 'A' ? '0 0 25px var(--cian)' : 'none'};">
                                            <h3 style="margin: 0 0 10px 0; font-size: 22px;">EQUIPO A</h3>
                                            <div style="font-size: 40px; font-weight: 900; margin-bottom: 10px;">${pA} PTS</div>
                                            <div style="font-size: 13px; font-weight: bold;">${miEquipo === 'A' ? '✓ TU EQUIPO ACTUAL' : 'HACER CLICK PARA UNIRSE'}</div>
                                        </div>

                                        <div onclick="window.seleccionarEquipoVersus('B', ${estaBloqueado})" style="flex: 1; min-width: 250px; background: ${miEquipo === 'B' ? 'var(--rosa)' : '#121212'}; color: ${miEquipo === 'B' ? '#000' : '#fff'}; border: 2px solid var(--rosa); padding: 30px; border-radius: 15px; text-align: center; cursor: pointer; transition: 0.3s; box-shadow: ${miEquipo === 'B' ? '0 0 25px var(--rosa)' : 'none'};">
                                            <h3 style="margin: 0 0 10px 0; font-size: 22px;">EQUIPO B</h3>
                                            <div style="font-size: 40px; font-weight: 900; margin-bottom: 10px;">${pB} PTS</div>
                                            <div style="font-size: 13px; font-weight: bold;">${miEquipo === 'B' ? '✓ TU EQUIPO ACTUAL' : 'HACER CLICK PARA UNIRSE'}</div>
                                        </div>
                                    </div>
                                </div>`;
                        }, { onlyOnce: true });
                    });
                });
                return;
            }

            if (juegosConSeleccion.includes(juegoLower) && !estadosComenzados[juegoLower]) {
                if (juegoLower === 'inv') {
                    onValue(ref(rtdb, `proyectos/${miCarpeta}/invertidosSeleccion`), (sAllSel) => {
                        if (juegoActualGlobal !== 'inv') return;
                        const allSelections = sAllSel.val() || {};
                        let Ocupados = {};
                        Object.keys(allSelections).forEach(user => {
                            if (allSelections[user] && allSelections[user].par) {
                                Ocupados[allSelections[user].par] = user;
                            }
                        });

                        let miParSeleccionado = allSelections[nickActual] ? allSelections[nickActual].par : null;
                        let gridHtml = "";

                        let paresGenerados = [];
                        for (let i = 1; i <= 89; i++) {
                            let strI = i < 10 ? "0" + i : "" + i;
                            let invStr = strI.split("").reverse().join("");
                            let numInv = parseInt(invStr);
                            
                            if (i !== numInv && i < numInv) {
                                let parStr = `${strI}-${invStr}`;
                                paresGenerados.push(parStr);
                            }
                        }

                        paresGenerados.forEach((parStr) => {
                            let ocupadoPor = Ocupados[parStr];
                            let esMio = (miParSeleccionado === parStr);
                            let estaOcupadoPorOtro = (ocupadoPor && ocupadoPor !== nickActual);

                            let claseCss = "";
                            let onclickAttr = `onclick="window.seleccionarParInvertido('${parStr}')"`;

                            if (esMio) {
                                claseCss = "invertido-seleccionado";
                            } else if (estaOcupadoPorOtro) {
                                claseCss = "invertido-ocupado";
                                onclickAttr = `title="Ocupado por ${ocupadoPor.toUpperCase()}"`;
                            }

                            gridHtml += `<div class="celda ${claseCss}" ${onclickAttr} style="font-size: 13px; padding: 14px 4px; font-weight: 900;">${parStr}</div>`;
                        });

                        grid.style.gridTemplateColumns = "repeat(auto-fill, minmax(90px, 1fr))";
                        grid.innerHTML = gridHtml;
                    });
                    return;
                }

                if (juegoLower === 'terna') {
                    onValue(ref(rtdb, `proyectos/${miCarpeta}/ternaSeleccion`), (sAllSel) => {
                        if (juegoActualGlobal !== 'terna') return;
                        const allSelections = sAllSel.val() || {};
                        let Ocupados = {};
                        Object.keys(allSelections).forEach(user => {
                            if (allSelections[user] && allSelections[user].terna) {
                                Ocupados[allSelections[user].terna] = user;
                            }
                        });

                        let miTernaSeleccionada = allSelections[nickActual] ? allSelections[nickActual].terna : null;
                        let gridHtml = "";

                        let ternasGeneradas = [];
                        for (let i = 1; i <= 88; i += 3) {
                            let t1 = i < 10 ? "0" + i : "" + i;
                            let t2 = (i+1) < 10 ? "0" + (i+1) : "" + (i+1);
                            let t3 = (i+2) < 10 ? "0" + (i+2) : "" + (i+2);
                            let tStr = `${t1}-${t2}-${t3}`;
                            ternasGeneradas.push(tStr);
                        }
                        for (let i = 1; i <= 50; i += 5) {
                            let t1 = i < 10 ? "0" + i : "" + i;
                            let nMed = i + 20;
                            let nTer = i + 40;
                            let tStr = `${t1}-${nMed}-${nTer}`;
                            if(!ternasGeneradas.includes(tStr)) ternasGeneradas.push(tStr);
                        }

                        ternasGeneradas.forEach((ternaStr) => {
                            let ocupadoPor = Ocupados[ternaStr];
                            let esMio = (miTernaSeleccionada === ternaStr);
                            let estaOcupadoPorOtro = (ocupadoPor && ocupadoPor !== nickActual);

                            let claseCss = "";
                            let onclickAttr = `onclick="window.seleccionarTernaUnica('${ternaStr}')"`;

                            if (esMio) {
                                claseCss = "invertido-seleccionado";
                            } else if (estaOcupadoPorOtro) {
                                claseCss = "invertido-ocupado";
                                onclickAttr = `title="Ocupado por ${ocupadoPor.toUpperCase()}"`;
                            }

                            gridHtml += `<div class="celda ${claseCss}" ${onclickAttr} style="font-size: 11px; padding: 12px 4px; font-weight: 900;">[ ${ternaStr.replace(/-/g, ' - ')} ]</div>`;
                        });

                        grid.style.gridTemplateColumns = "repeat(auto-fill, minmax(130px, 1fr))";
                        grid.innerHTML = gridHtml;
                    });
                    return;
                }

                onValue(ref(rtdb, `proyectos/${miCarpeta}/${juegoLower}Seleccion`), (sAllSel) => {
                    if (juegoActualGlobal !== juegoLower) return;

                    const allSelections = sAllSel.val() || {};
                    let cartasOcupadas = {}; 
                    Object.keys(allSelections).forEach(user => {
                        if (allSelections[user] && Array.isArray(allSelections[user].cartas)) {
                            allSelections[user].cartas.forEach(c => { cartasOcupadas[c] = user; });
                        }
                    });

                    const misCartas = (allSelections[nickActual] && Array.isArray(allSelections[nickActual].cartas)) ? allSelections[nickActual].cartas : [];
                    const elementos = listasJuegos[juegoLower];
                    let gridHtml = "";

                    elementos.forEach((carta, index) => {
                        const ocupadoPor = cartasOcupadas[carta];
                        const esMia = misCartas.includes(carta);
                        const estaOcupadoPorOtro = (ocupadoPor && ocupadoPor !== nickActual);

                        let claseCss = "";
                        let onclickAttr = `onclick="window.seleccionarCartaGenerica('${juegoLower}', '${carta}')"`;

                        if (esMia) {
                            claseCss = "invertido-seleccionado";
                        } else if (estaOcupadoPorOtro) {
                            claseCss = "invertido-ocupado";
                            onclickAttr = `title="Ocupado por ${ocupadoPor.toUpperCase()}"`;
                        }

                        gridHtml += `<div class="celda ${claseCss}" ${onclickAttr} style="font-size: 9px; padding: 10px 2px; font-weight: 900;">#${index + 1} ${carta}</div>`;
                    });

                    grid.style.gridTemplateColumns = "repeat(auto-fill, minmax(110px, 1fr))";
                    grid.innerHTML = gridHtml;
                });
                return;
            }

            if (juegoLower === 'inv' && estadosComenzados['inv']) {
                let totalNums = 90;
                grid.style.gridTemplateColumns = `repeat(10, 1fr)`;
                for(let i=1; i<=totalNums; i++) {
                    const esta = sacados.includes(String(i)) || sacados.includes(Number(i));
                    html += `<div class="celda ${esta ? 'marcada' : ''}">${i}</div>`;
                }
                grid.innerHTML = html;
                return;
            }

            if (juegoLower === 'terna' && estadosComenzados['terna']) {
                let totalNums = 90;
                grid.style.gridTemplateColumns = `repeat(10, 1fr)`;
                for(let i=1; i<=totalNums; i++) {
                    const esta = sacados.includes(String(i)) || sacados.includes(Number(i));
                    html += `<div class="celda ${esta ? 'marcada' : ''}">${i}</div>`;
                }
                grid.innerHTML = html;
                return;
            }

            if (juegosConSeleccion.includes(juegoLower) && estadosComenzados[juegoLower]) {
                const elementos = listasJuegos[juegoLower];
                elementos.forEach((el, index) => {
                    const esta = sacados.includes(el);
                    html += `<div class="celda ${esta ? 'marcada' : ''}" style="font-size: 9px; padding: 10px 2px;">#${index + 1} ${el}</div>`;
                });
                grid.style.gridTemplateColumns = "repeat(auto-fill, minmax(110px, 1fr))";
                grid.innerHTML = html;
                return;
            }

            let totalNums = 90;
            let columnas = 10;

            if (juegoLower === '72' || juegoLower === 'bingo72') { totalNums = 72; columnas = 9; }
            else if (juegoLower === '100' || juegoLower === 'bingo100') { totalNums = 100; }

            grid.style.gridTemplateColumns = `repeat(${columnas}, 1fr)`;
            for(let i=1; i<=totalNums; i++) {
                const esta = sacados.includes(i) || sacados.includes(String(i)) || sacados.includes(Number(i));
                html += `<div class="celda ${esta ? 'marcada' : ''}">${i}</div>`;
            }
            grid.innerHTML = html;
        }

        window.seleccionarParInvertido = (par) => {
            const nickActual = localStorage.getItem(`jugador_sesion_${miCarpeta}`);
            const refGlobal = ref(rtdb, `proyectos/${miCarpeta}/invertidosSeleccion`);

            onValue(refGlobal, (snapshot) => {
                const data = snapshot.val() || {};
                let ocupado = false;
                Object.keys(data).forEach(user => {
                    if (user !== nickActual && data[user] && data[user].par === par) {
                        ocupado = true;
                    }
                });

                if (ocupado) {
                    alert("¡Este par ya ha sido elegido por otro jugador!");
                    return;
                }

                const refUser = ref(rtdb, `proyectos/${miCarpeta}/invertidosSeleccion/${nickActual}`);
                onValue(refUser, (snapUsr) => {
                    let actual = snapUsr.val() || {};
                    let nuevoPar = (actual.par === par) ? null : par;

                    set(refUser, nuevoPar ? { par: nuevoPar, timestamp: Date.now() } : null);
                }, { onlyOnce: true });
            }, { onlyOnce: true });
        };

        window.seleccionarTernaUnica = (terna) => {
            const nickActual = localStorage.getItem(`jugador_sesion_${miCarpeta}`);
            const refGlobal = ref(rtdb, `proyectos/${miCarpeta}/ternaSeleccion`);

            onValue(refGlobal, (snapshot) => {
                const data = snapshot.val() || {};
                let ocupado = false;
                Object.keys(data).forEach(user => {
                    if (user !== nickActual && data[user] && data[user].terna === terna) {
                        ocupado = true;
                    }
                });

                if (ocupado) {
                    alert("¡Esta terna ya ha sido elegida por otro jugador!");
                    return;
                }

                const refUser = ref(rtdb, `proyectos/${miCarpeta}/ternaSeleccion/${nickActual}`);
                onValue(refUser, (snapUsr) => {
                    let actual = snapUsr.val() || {};
                    let nuevaTerna = (actual.terna === terna) ? null : terna;

                    set(refUser, nuevaTerna ? { terna: nuevaTerna, timestamp: Date.now() } : null);
                }, { onlyOnce: true });
            }, { onlyOnce: true });
        };

        window.seleccionarEquipoVersus = (equipo, bloqueado) => {
            if (bloqueado) {
                alert("El administrador ha bloqueado el cambio de equipos en este momento.");
                return;
            }
            const nickActual = localStorage.getItem(`jugador_sesion_${miCarpeta}`);
            const refUser = ref(rtdb, `proyectos/${miCarpeta}/sumarversusSeleccion/${nickActual}`);
            
            set(refUser, { equipo: equipo, timestamp: Date.now() });
        };

        window.seleccionarCartaGenerica = (juego, carta) => {
            const nickActual = localStorage.getItem(`jugador_sesion_${miCarpeta}`);
            const refSel = ref(rtdb, `proyectos/${miCarpeta}/${juego}Seleccion/${nickActual}/cartas`);
            const refGlobal = ref(rtdb, `proyectos/${miCarpeta}/${juego}Seleccion`);

            onValue(refGlobal, (snapshot) => {
                const data = snapshot.val() || {};
                let ocupadaPorOtro = false;
                Object.keys(data).forEach(user => {
                    if (user !== nickActual && data[user] && Array.isArray(data[user].cartas)) {
                        if (data[user].cartas.includes(carta)) ocupadaPorOtro = true;
                    }
                });

                if (ocupadaPorOtro) {
                    alert("¡Esta opción ya ha sido elegida por otro jugador!");
                    return;
                }

                onValue(refSel, (snapCartas) => {
                    let misCartas = snapCartas.val() || [];
                    if (!Array.isArray(misCartas)) misCartas = Object.values(misCartas);

                    if (misCartas.includes(carta)) {
                        misCartas = misCartas.filter(c => c !== carta);
                    } else {
                        if (misCartas.length >= maxSeleccionesGlobal) {
                            alert(`¡Solo puedes seleccionar un máximo de ${maxSeleccionesGlobal} opciones distintas!`);
                            return;
                        }
                        misCartas.push(carta);
                    }

                    const refUserGen = ref(rtdb, `proyectos/${miCarpeta}/${juego}Seleccion/${nickActual}`);
                    set(refUserGen, {
                        cartas: misCartas,
                        timestamp: Date.now()
                    });
                }, { onlyOnce: true });
            }, { onlyOnce: true });
        };
    </script>
