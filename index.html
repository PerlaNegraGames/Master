<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMINISTRACION | JUGARPRO</title>
    <link rel="icon" href="https://xatimg.com/image/CVmUYuMBEmLd.gif" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --cian: #00ffff; --rosa: #ff00ff; --verde: #39ff14; 
            --amarillo: #ffff00; --rojo: #ff0000; --violeta: #bc13fe;
        }
        body { 
            background: #000; 
            color: #fff; 
            font-family: sans-serif; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
        }
        #contenido-admin { width: 100%; display: none; flex-direction: column; align-items: center; } 
        .header-top { 
            width: 100%; 
            background: #050505; 
            border-bottom: 1px solid #111; 
            display: flex; 
            justify-content: center !important;
            padding: 15px 0; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            box-sizing: border-box;
        }
        .contenedor-central { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            width: 100%; 
            max-width: 900px; 
            padding: 0 20px;
            margin: 0 auto;
        }
        .logo-main { font-size: 24px; font-weight: 900; letter-spacing: 2px; }
        
        .btn-efecto { background: #000; border: 1px solid #FF69B4; color: #FF69B4; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 11px; text-transform: uppercase; transition: 0.3s; }
        .btn-efecto:hover { border-color: var(--cian); color: var(--cian); box-shadow: 0 0 10px var(--cian); }
        .menu-modos { width: 95%; max-width: 900px; margin-top: 25px; padding: 20px; background: #080808; border: 1px solid #151515; border-radius: 15px; box-sizing: border-box; }
        .buscador-container { position: relative; display: flex; gap: 10px; }
        #input-busqueda { flex-grow: 1; background: #000; border: 1px solid var(--verde); color: var(--verde); padding: 15px; border-radius: 10px; font-weight: 900; outline: none; box-shadow: inset 0 0 8px var(--verde); cursor: pointer; text-transform: uppercase; }
        #sugerencias { position: absolute; top: 60px; left: 0; width: calc(100% - 130px); background: #080808; border: 1px solid var(--verde); border-radius: 10px; z-index: 1000; display: none; max-height: 250px; overflow-y: auto; box-shadow: 0 0 15px var(--verde); }
        .sug-item { padding: 15px; cursor: pointer; border-bottom: 1px solid #151515; font-weight: 900; text-transform: uppercase; transition: 0.2s; color: #fff; }
        .sug-item:hover { background: var(--verde); color: #000; box-shadow: 0 0 20px var(--verde); }
        
        .footer-sorteadores { width: 95%; max-width: 900px; margin: 30px 0 50px 0; padding: 20px; background: #050505; border: 1px solid #151515; border-radius: 15px; box-sizing: border-box; }
        .sort-flex { display: flex; gap: 15px; align-items: center; }
        .select-sorteador { flex: 1; background: #000; border: 1px solid var(--violeta); color: var(--violeta); padding: 12px; border-radius: 10px; font-weight: bold; outline: none; cursor: pointer; }
        .btn-abrir { background: var(--violeta); color: #fff; border: none; padding: 12px 20px; border-radius: 10px; font-weight: 900; cursor: pointer; box-shadow: 0 0 15px var(--violeta); }
        .btn-reg { flex: 0.8; background: #000; color: var(--amarillo); border: 1px solid var(--amarillo); padding: 12px; border-radius: 10px; cursor: pointer; font-weight: 900; box-shadow: 0 0 10px var(--amarillo); }
        
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; justify-content: center; align-items: center; z-index: 10000; }
        #modal-reg { background: #0a0a0a; border: 2px solid #222; width: 95%; max-width: 500px; padding: 20px; border-radius: 15px; display: flex; flex-direction: column; max-height: 85vh; }
        .item-reg { display: flex; align-items: center; background: #0a0a0a; border: 1px solid #222; margin-bottom: 5px; padding: 10px; border-radius: 6px; }
        
        #capa-login { position: fixed; inset: 0; z-index: 99999; background: radial-gradient(circle, #000814 0%, #000000 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .login-card { background: rgba(0, 0, 0, 0.9); border: 2px solid #800020; padding: 40px; border-radius: 30px; text-align: center; box-shadow: 0 0 30px rgba(128, 0, 32, 0.6); backdrop-filter: blur(10px); width: 100%; max-width: 350px; display: flex; flex-direction: column; align-items: center; }
        .input-container { position: relative; width: 100%; max-width: 280px; margin: 0 auto; }
        #pin-input { background: #000 !important; border: 1px solid #4a0012; color: #fff; padding: 10px; padding-right: 45px; text-align: center; font-size: 20px; width: 100%; outline: none; border-radius: 12px; transition: 0.4s; font-weight: bold; box-sizing: border-box; }
        #pin-input:focus { border-color: #800020; box-shadow: 0 0 15px #800020; }
        .toggle-password { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #444; cursor: pointer; font-size: 18px; }
        #busc-reg { width: 100%; box-sizing: border-box; background: #000; border: 1px solid var(--amarillo); color: var(--amarillo); padding: 12px; margin-bottom: 15px; border-radius: 8px; outline: none; font-weight: 900; text-transform: uppercase; }
    </style>
</head>
<body>

<div id="capa-login">
    <div class="login-card">
        <div style="width: 70px; height: 70px; background: rgba(128, 0, 32, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; border: 1px solid #800020;">
            <i class="fas fa-user-shield" style="color: #800020; font-size: 30px;"></i>
        </div>
        <h1 style="color:#fff; font-size:16px; margin-bottom:30px; letter-spacing: 3px; font-weight: 900;">ACCESO <span style="color:#800020">RESTRINGIDO</span></h1>
        <div class="input-container">
            <input type="password" id="pin-input" placeholder="••••" autocomplete="off">
            <i class="fas fa-eye toggle-password" id="ver-password"></i>
        </div>
        <button id="btn-login" class="btn-abrir" style="width:100%; max-width:280px; background:#800020; color:#fff; margin:20px auto 0; border-radius: 12px; height: 45px; font-size: 13px; box-shadow: 0 0 15px rgba(128, 0, 32, 0.5); border:none;">INGRESAR</button>
        <div id="err-log" style="color:var(--rojo); margin-top:15px; font-size: 11px; font-weight:bold; text-transform: uppercase;"></div>
    </div>
</div>

<div id="contenido-admin">
    <div class="header-top">
        <div class="contenedor-central">
            <div class="logo-main">JUGA<span style="color:var(--cian)">PRO</span></div>
            <div style="display:flex; gap:8px;">
                <button class="btn-efecto" onclick="window.abrirModalFondo()" style="border-color: #FFFF00; color: #FFFF00;" title="CAMBIAR FONDO">🎨 DISEÑO</button>
                <button class="btn-efecto" onclick="window.abrirModalPin()" style="border-color: #C71585; color: #C71585;" title="CAMBIAR CLAVE">⚙️ CLAVE</button>
                <button onclick="cerrarSesion()" class="btn-efecto" style="border-color: #A020F0; color: #A020F0;" title="CERRAR SESIÓN"><i class="fas fa-power-off"></i> SALIR</button>
            </div>
        </div>
    </div>

    <div class="menu-modos">
        <div class="buscador-container">
            <input type="text" id="input-busqueda" placeholder="SELECCIONAR JUEGO..." readonly>
            <div id="sugerencias"></div>
            <button id="btn-aplicar-modo" class="btn-abrir" style="background:var(--verde); color:#000;">APLICAR</button>
        </div>
    </div>

    <div id="panel-juego" style="width:100%; max-width:900px; margin-top:20px;"></div>

    <div class="footer-sorteadores">
        <div class="sort-flex">
            <select id="select-sorteador" class="select-sorteador"></select>
            <button id="btn-abrir-sort" class="btn-abrir">ABRIR</button>
            <button id="btn-ver-reg" class="btn-reg">👤 REGISTRADOS (<span id="count-total">0</span>)</button>
        </div>
    </div>
</div>

<div id="overlay-reg" class="modal-overlay">
    <div id="modal-reg">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h2 style="color:var(--amarillo); margin:0;">REGISTRADOS</h2>
            <button onclick="cerrarRegistrados()" class="btn-efecto" style="border-color:red; color:red;">CERRAR</button>
        </div>
        
        <div style="background:#121212; padding:12px; border-radius:8px; margin-bottom:12px; border:1px solid var(--amarillo);">
            <h4 style="color:var(--amarillo); margin:0 0 8px 0; font-size:12px; text-transform:uppercase;">➕ CREAR NUEVO USUARIO</h4>
            <div style="display:flex; gap:6px; flex-wrap:wrap;">
                <input type="text" id="nuevo-nick" placeholder="NICK / USUARIO" style="flex:1; background:#000; border:1px solid #444; color:#fff; padding:8px; border-radius:6px; font-size:11px; outline:none; text-transform:uppercase;">
                <input type="text" id="nuevo-pin" placeholder="PIN" style="width:70px; background:#000; border:1px solid #444; color:#fff; padding:8px; border-radius:6px; font-size:11px; outline:none; text-align:center;">
                <select id="nuevo-sexo" style="background:#000; border:1px solid #444; color:#fff; padding:8px; border-radius:6px; font-size:11px; outline:none;">
                    <option value="H">♂ HOMBRE</option>
                    <option value="M">♀ MUJER</option>
                </select>
                <button onclick="window.crearUsuarioAdmin()" class="btn-abrir" style="background:var(--amarillo); color:#000; padding:8px 12px; font-size:11px;">CREAR</button>
            </div>
            <div id="err-crear-usr" style="color:var(--rojo); font-size:10px; margin-top:5px; font-weight:bold;"></div>
        </div>

        <div id="area-contadores" style="display:flex; gap:10px; margin-bottom:10px; background:#111; padding:10px; border-radius:8px; border:1px solid #222; justify-content:center; font-weight:900; font-size:12px;">
            <span style="color:var(--cian)">♂ HOMBRES: <span id="c-h">0</span></span>
            <span style="color:var(--rosa)">♀ MUJERES: <span id="c-m">0</span></span>
        </div>
        <input type="text" id="busc-reg" onkeyup="window.filtrarReg()" placeholder="BUSCAR POR NICK...">
        <div id="lista-usuarios" style="overflow-y:auto; flex:1;"></div>
    </div>
</div>

<div id="modal-fondo" class="modal-overlay">
    <div style="background: #0a0a0a; border: 2px solid var(--rosa); padding: 20px; border-radius: 15px; width: 380px; display: flex; flex-direction: column; box-shadow: 0 0 30px #000;">
        <h2 style="color:var(--rosa); text-align:center; margin: 0 0 15px 0; font-size: 18px;">DISEÑO DE FONDO</h2>
        <p style="font-size:10px; color:#666; margin-bottom:5px; text-transform: uppercase; font-weight: bold;">URL Imagen o Color Hex:</p>
        <input type="text" id="input-url-fondo" placeholder="https://... o #000" style="width:100%; background:#000; border:1px solid #333; color:#fff; padding:10px; border-radius:8px; margin-bottom:15px; box-sizing:border-box; outline: none;">
        <div style="display:flex; gap:10px;">
            <button onclick="guardarNuevoFondo()" class="btn-abrir" style="flex:1.5; background:var(--rosa); height: 40px; font-size: 11px;">APLICAR</button>
            <button onclick="cerrarModalFondo()" class="btn-efecto" style="flex:1; height: 40px;">CERRAR</button>
        </div>
    </div>
</div>

<div id="modal-cambiar-pin" class="modal-overlay">
    <div style="background: #0a0a0a; border: 2px solid var(--verde); padding: 25px; border-radius: 15px; width: 320px; display: flex; flex-direction: column; box-shadow: 0 0 30px #000;">
        <h2 style="color:var(--verde); text-align:center; margin: 0 0 10px 0; font-size: 18px;">SEGURIDAD</h2>
        <p style="font-size:10px; color:#666; text-align:center; margin-bottom: 20px; text-transform: uppercase;">Establecer nuevo PIN de acceso</p>
        <input type="text" id="nuevo-pin-input" placeholder="MÍNIMO 4 DÍGITOS" style="width:100%; background:#000; border:1px solid var(--verde); color:var(--verde); padding:12px; border-radius:10px; text-align:center; font-size:18px; margin-bottom:20px; box-sizing:border-box; outline:none; font-weight: bold;">
        <div style="display:flex; gap:10px;">
            <button onclick="guardarNuevoPin()" class="btn-abrir" style="flex:1.5; background:var(--verde); color:#000; height: 40px; font-size: 11px;">ACTUALIZAR</button>
            <button onclick="cerrarModalPin()" class="btn-efecto" style="flex:1; height: 40px;">CANCELAR</button>
        </div>
    </div>
</div>

<div id="modal-confirmar-borrar" class="modal-overlay" style="z-index: 10001;">
    <div style="background: #0a0a0a; border: 2px solid var(--rojo); padding: 25px; border-radius: 15px; width: 300px; text-align: center; box-shadow: 0 0 30px rgba(255,0,0,0.2);">
        <i class="fas fa-user-times" style="color: var(--rojo); font-size: 40px; margin-bottom: 15px;"></i>
        <h2 style="color: #fff; font-size: 16px; margin: 0 0 10px 0; text-transform: uppercase;">¿Eliminar Usuario?</h2>
        <p id="txt-confirmar-usuario" style="color: #666; font-size: 12px; margin-bottom: 20px; font-weight: bold;"></p>
        <div style="display: flex; gap: 10px;">
            <button id="btn-si-borrar" class="btn-abrir" style="flex: 1; background: var(--rojo); color: #fff; height: 35px; font-size: 11px;">ELIMINAR</button>
            <button onclick="cerrarModalBorrar()" class="btn-efecto" style="flex: 1; height: 35px; border-color: #444; color: #444;">CANCELAR</button>
        </div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc, onSnapshot, updateDoc, collection, deleteDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getDatabase } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyBd1fw2nWohvcveNCilf6xg4xZDCNdmEQw",
    authDomain: "juegos-16e17.firebaseapp.com",
    databaseURL: "https://juegos-16e17-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "juegos-16e17",
    storageBucket: "juegos-16e17.firebasestorage.app",
    messagingSenderId: "566680151031",
    appId: "1:566680151031:web:9a400f22df8bda0e6184f2",
    measurementId: "G-YJVGWVQ3V3"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const rtdb = getDatabase(app);

window.JUEGOS_CONFIG = {
    "50": "BINGO 50", "72": "BINGO 72", "90": "BINGO 90", "100": "BINGO 100",
    "inv": "INVERTIDOS", "bingocartones": "Bingo De Cartones", "terna": "TERNAS",
    "mex": "LOTERIA MEXICANA", "pokemon": "Pokemon", "romanos90": "ROMANOS 90"
};

window.SORTEADORES_CONFIG = {
    "bingo50": "BINGO 50", "bingo72": "BINGO 72", "bingo90": "BINGO 90",
    "bingo100": "BINGO 100", "bingo120": "TERNA 120", "lm": "LOTERÍA MEXICANA"
};

const urlParams = new URLSearchParams(window.location.search);
const miCarpeta = urlParams.get('p') || urlParams.get('proyecto') || "gh";

let usuariosLocal = [], modoActivo = null;
let pinDeEntrada = sessionStorage.getItem(`admin_p_volatil`);
let miSesionActual = null;

document.getElementById('ver-password').onclick = function() {
    const input = document.getElementById('pin-input');
    input.type = (input.type === "password") ? "text" : "password";
    this.classList.toggle('fa-eye');
    this.classList.toggle('fa-eye-slash');
};

async function validarLoginLocal(pin) {
    try {
        const pRef = doc(db, "proyectos", miCarpeta);
        const snap = await getDoc(pRef);
        if (!snap.exists()) return { valida: false, msg: "PROYECTO NO EXISTE" };
        const data = snap.data();
        if (pin !== String(data.pinAdmin)) return { valida: false, msg: "PIN INCORRECTO" };
        return { valida: true, sessionToken: data.sessionToken || `SES_${Date.now()}` };
    } catch (e) {
        return { valida: false, msg: "ERROR DE CONEXIÓN" };
    }
}

function arrancarTodo() {
    document.getElementById('contenido-admin').style.display = 'flex';
    document.getElementById('capa-login').style.display = 'none';
    const refProy = doc(db, "proyectos", miCarpeta);

    onSnapshot(refProy, (snap) => {
        const d = snap.data();
        if(!d) return;

        window.misJuegosDB = d.juegos || [];           
        window.misSorteadoresDB = d.sorteadores || []; 

        const selectSort = document.getElementById('select-sorteador');
        const valSelectAnterior = selectSort.value;
        const listaSorteadores = (window.misSorteadoresDB.length > 0) ? window.misSorteadoresDB : Object.keys(window.SORTEADORES_CONFIG);

        selectSort.innerHTML = listaSorteadores.map(id => {
            const idLimpio = String(id).trim();
            const nombreLindo = window.SORTEADORES_CONFIG[idLimpio] || idLimpio.toUpperCase();
            return `<option value="${idLimpio}">${nombreLindo}</option>`;
        }).join('');

        if(listaSorteadores.includes(valSelectAnterior)) selectSort.value = valSelectAnterior;

        if (miSesionActual === null) miSesionActual = d.sessionToken;

        if(d.fondoPersonalizado) {
            document.body.style.background = d.fondoPersonalizado.includes('http') 
                ? `url('${d.fondoPersonalizado}') center/cover no-repeat fixed` 
                : d.fondoPersonalizado;
        }

        const juegoActivoLimpio = d.juegoActivo ? String(d.juegoActivo).trim() : null;
        if(juegoActivoLimpio && modoActivo !== juegoActivoLimpio) { 
            modoActivo = juegoActivoLimpio; 
            cargarMod(juegoActivoLimpio); 
        }
    });

    onSnapshot(collection(db, "proyectos", miCarpeta, "registrados"), (snap) => {
        usuariosLocal = []; let h = 0, m = 0;
        snap.forEach(u => { 
            const ud = u.data(); ud.id = u.id; usuariosLocal.push(ud); 
            if(ud.sexo === 'H' || ud.genero === 'HOMBRE') h++; else m++; 
        });
        document.getElementById('count-total').innerText = snap.size;
        document.getElementById('c-h').innerText = h; 
        document.getElementById('c-m').innerText = m;
        window.renderUsuarios(usuariosLocal);
    });
}

window.renderUsuarios = (lista) => {
    document.getElementById('lista-usuarios').innerHTML = lista.map(u => {
        const esH = (u.sexo === 'H' || u.genero === 'HOMBRE');
        const colorG = esH ? 'var(--cian)' : 'var(--rosa)';
        return `
        <div class="item-reg" style="border-left: 4px solid ${colorG}; background:#080808; padding:12px; margin-bottom:10px; border-radius:8px; display:flex; align-items:center;">
            <span onclick="window.cambiarSexo('${u.id}', '${u.sexo || (esH?'H':'M')}')" style="color:${colorG}; font-size:26px; cursor:pointer; width:45px; text-align:center;">
                ${esH ? '♂' : '♀'}
            </span>
            <div style="flex:1; margin-left:12px;">
                <div style="font-weight:900; font-size:16px; text-transform:uppercase;">
                    ${u.nick || u.id}
                </div>
                <div style="font-size:11px; margin-top:2px;">
                    <span>PIN: ${u.pin || '----'}</span>
                </div>
            </div>
            <button onclick="window.borrarU('${u.id}')" style="border:1px solid var(--rojo); color:var(--rojo); background:none; font-size:9px; padding:8px 12px; border-radius:5px; cursor:pointer;">
                ELIMINAR
            </button>
        </div>`;
    }).join('');
};

window.filtrarReg = () => {
    const bus = document.getElementById('busc-reg').value.toUpperCase();
    const filtrados = usuariosLocal.filter(u => (u.nick || "").toUpperCase().includes(bus) || u.id.includes(bus));
    window.renderUsuarios(filtrados);
};

window.crearUsuarioAdmin = async () => {
    const nick = document.getElementById('nuevo-nick').value.trim().toUpperCase();
    const pin = document.getElementById('nuevo-pin').value.trim();
    const sexo = document.getElementById('nuevo-sexo').value;
    const errDiv = document.getElementById('err-crear-usr');

    if (!nick || !pin) {
        errDiv.innerText = "COMPLETA NICK Y PIN";
        return;
    }

    try {
        const userRef = doc(db, "proyectos", miCarpeta, "registrados", nick);
        await setDoc(userRef, {
            nick: nick,
            pin: pin,
            sexo: sexo,
            genero: sexo === 'H' ? 'HOMBRE' : 'MUJER',
            creado: Date.now()
        });
        document.getElementById('nuevo-nick').value = '';
        document.getElementById('nuevo-pin').value = '';
        errDiv.innerText = "";
        alert("¡Usuario creado con éxito!");
    } catch (e) {
        errDiv.innerText = "ERROR AL CREAR USUARIO";
        console.error(e);
    }
};

window.abrirModalFondo = () => document.getElementById('modal-fondo').style.display = 'flex';
window.cerrarModalFondo = () => document.getElementById('modal-fondo').style.display = 'none';
window.guardarNuevoFondo = async () => { 
    const url = document.getElementById('input-url-fondo').value.trim(); 
    if(url) { await updateDoc(doc(db, "proyectos", miCarpeta), { fondoPersonalizado: url }); cerrarModalFondo(); } 
};

window.abrirModalPin = () => document.getElementById('modal-cambiar-pin').style.display = 'flex';
window.cerrarModalPin = () => document.getElementById('modal-cambiar-pin').style.display = 'none';
window.guardarNuevoPin = async () => { 
    const p = document.getElementById('nuevo-pin-input').value.trim(); 
    if(p.length >= 4){ await updateDoc(doc(db, "proyectos", miCarpeta), { pinAdmin: p }); sessionStorage.setItem(`admin_p_volatil`, p); location.reload(); } 
};

window.cambiarSexo = async (id, s) => { 
    const nS = s==='H'?'M':'H'; await updateDoc(doc(db, "proyectos", miCarpeta, "registrados", id), { sexo: nS, genero: nS==='H'?'HOMBRE':'MUJER' }); 
};

let usuarioAEliminar = null;
window.borrarU = (id) => {
    usuarioAEliminar = id;
    document.getElementById('txt-confirmar-usuario').innerText = "ID: " + id;
    document.getElementById('modal-confirmar-borrar').style.display = 'flex';
};

window.cerrarModalBorrar = () => document.getElementById('modal-confirmar-borrar').style.display = 'none';

document.getElementById('btn-si-borrar').onclick = async () => {
    if (usuarioAEliminar) {
        await deleteDoc(doc(db, "proyectos", miCarpeta, "registrados", usuarioAEliminar));
        cerrarModalBorrar();
    }
};

window.cerrarRegistrados = () => document.getElementById('overlay-reg').style.display = 'none';
document.getElementById('btn-ver-reg').onclick = () => document.getElementById('overlay-reg').style.display = 'flex';

let tempJuego = null;
document.getElementById('input-busqueda').onclick = () => {
    const sug = document.getElementById('sugerencias');
    const listaJuegos = (window.misJuegosDB && window.misJuegosDB.length > 0) ? window.misJuegosDB : Object.keys(window.JUEGOS_CONFIG);
    sug.innerHTML = listaJuegos.map(id => {
        const idLimpio = String(id).trim();
        const nombreLindo = window.JUEGOS_CONFIG[idLimpio] || idLimpio.toUpperCase();
        return `<div class="sug-item" onclick="window.seleccionarJuego('${idLimpio}')">${nombreLindo}</div>`;
    }).join('');
    sug.style.display = 'block';
};

window.seleccionarJuego = (id) => {
    tempJuego = String(id).trim(); 
    document.getElementById('input-busqueda').value = window.JUEGOS_CONFIG[tempJuego] || tempJuego.toUpperCase();
    document.getElementById('sugerencias').style.display = 'none';
};

document.getElementById('btn-aplicar-modo').onclick = async () => {
    if (tempJuego) await updateDoc(doc(db, "proyectos", miCarpeta), { juegoActivo: tempJuego });
};

document.getElementById('btn-abrir-sort').onclick = () => {
    const cod = document.getElementById('select-sorteador').value;
    if (cod) window.open(`sorteadores.html?c=${cod}&p=${miCarpeta}`, "Sorteador", "width=1100,height=850");
};

window.cerrarSesion = () => { sessionStorage.clear(); location.reload(); };

async function cargarMod(m) { 
    const p = document.getElementById('panel-juego'); 
    if (!m) return;

    const juegoLimpio = String(m).trim();
    const rutaModulo = `./modulos/admin_${encodeURIComponent(juegoLimpio)}.js?v=${Date.now()}`;
    
    try { 
        const mod = await import(rutaModulo); 
        if (mod && mod.iniciar) { 
            p.innerHTML = ''; 
            mod.iniciar(p, db, miCarpeta, rtdb); 
        } else {
            p.innerHTML = `<div style="color:var(--rojo); text-align:center; padding:20px;">⚠️ El módulo "admin_${juegoLimpio}.js" no exporta la función "iniciar".</div>`;
        }
    } catch(e) { 
        console.error("Error detallado al cargar el módulo:", e);
        p.innerHTML = `
            <div style="color:var(--rojo); text-align:center; padding:20px; border: 1px dashed var(--rojo); border-radius:10px; margin:20px;">
                ⚠️ <b>No se pudo cargar el módulo:</b> admin_${juegoLimpio}.js<br>
                <small style="color:#bbb; display:block; margin-top:8px;">
                    Verifica que el archivo exista en <code>/modulos/admin_${juegoLimpio}.js</code> y no tenga errores de sintaxis.
                </small>
            </div>`;
    }
}

if (pinDeEntrada) arrancarTodo();
else document.getElementById('capa-login').style.display = 'flex';

document.getElementById('btn-login').onclick = async () => {
    const pinIn = document.getElementById('pin-input').value;
    const res = await validarLoginLocal(pinIn);
    if (res.valida) {
        sessionStorage.setItem(`admin_p_volatil`, pinIn);
        location.reload();
    } else {
        document.getElementById('err-log').innerText = res.msg;
    }
};
</script>
</body>
</html>
