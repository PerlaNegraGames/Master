<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMINISTRACION | PERLANEGRAGAMES</title>
    <link rel="icon" href="https://xatimg.com/image/CVmUYuMBEmLd.gif" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --cian: #00ffff; --rosa: #ff00ff; --verde: #39ff14; 
            --amarillo: #ffff00; --rojo: #ff0000; --violeta: #bc13fe;
        }
        body { 
            background: #000; color: #fff; font-family: sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }
        #contenido-admin { width: 100%; display: none; flex-direction: column; align-items: center; } 
        .header-top { 
            width: 100%; background: #050505; border-bottom: 1px solid #111; display: flex; justify-content: center !important; padding: 15px 0; position: sticky; top: 0; z-index: 100; box-sizing: border-box;
        }
        .contenedor-central { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 1350px; padding: 0 20px; margin: 0 auto; }
        .logo-main { font-size: 24px; font-weight: 900; letter-spacing: 2px; }
        .btn-efecto { background: #000; border: 1px solid #FF69B4; color: #FF69B4; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 11px; text-transform: uppercase; transition: 0.3s; }
        .btn-efecto:hover { border-color: var(--cian); color: var(--cian); box-shadow: 0 0 10px var(--cian); }
        .layout-admin-principal { display: flex; gap: 20px; width: 100%; max-width: 1350px; box-sizing: border-box; align-items: flex-start; justify-content: center; margin-top: 25px; padding: 0 20px; }
        .sidebar-conectados-admin { width: 330px; background: #080808; border: 1px solid #222; border-radius: 12px; padding: 15px; box-sizing: border-box; flex-shrink: 0; }
        .sidebar-conectados-admin h3 { color: var(--verde); font-size: 12px; text-transform: uppercase; margin-top: 0; margin-bottom: 12px; border-bottom: 1px solid #222; padding-bottom: 8px; letter-spacing: 1px; }
        #lista-conectados-admin-view { display: flex; flex-direction: column; gap: 8px; max-height: 550px; overflow-y: auto; }
        .item-conectado { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; background: #111; padding: 10px; border-radius: 6px; font-size: 11px; border: 1px solid #1a1a1a; box-sizing: border-box; width: 100%; }
        .punto-online { width: 8px; height: 8px; background: var(--verde); border-radius: 50%; box-shadow: 0 0 6px var(--verde); flex-shrink: 0; }
        .badge-invertido { background: #1a1a1a; border: 1px dashed var(--amarillo); color: var(--amarillo); padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: 900; letter-spacing: 0.5px; width: 100%; box-sizing: border-box; white-space: normal; word-break: break-word; text-align: left; }
        .num-inv-rojo { color: var(--rojo) !important; text-decoration: line-through; }
        .main-admin-columna { flex: 1; display: flex; flex-direction: column; align-items: center; max-width: 950px; }
        .menu-modos { width: 100%; padding: 20px; background: #080808; border: 1px solid #151515; border-radius: 15px; box-sizing: border-box; }
        .buscador-container { position: relative; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        #input-busqueda { flex-grow: 1; background: #000; border: 1px solid var(--verde); color: var(--verde); padding: 15px; border-radius: 10px; font-weight: 900; outline: none; box-shadow: inset 0 0 8px var(--verde); cursor: pointer; text-transform: uppercase; }
        #sugerencias { position: absolute; top: 60px; left: 0; width: calc(100% - 130px); background: #080808; border: 1px solid var(--verde); border-radius: 10px; z-index: 1000; display: none; max-height: 250px; overflow-y: auto; box-shadow: 0 0 15px var(--verde); }
        .sug-item { padding: 15px; cursor: pointer; border-bottom: 1px solid #151515; font-weight: 900; text-transform: uppercase; transition: 0.2s; color: #fff; }
        .sug-item:hover { background: var(--verde); color: #000; box-shadow: 0 0 20px var(--verde); }
        .btn-abrir { background: var(--violeta); color: #fff; border: none; padding: 12px 20px; border-radius: 10px; font-weight: 900; cursor: pointer; box-shadow: 0 0 15px var(--violeta); }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; justify-content: center; align-items: center; z-index: 10000; }
        #modal-reg { background: #0a0a0a; border: 2px solid #222; width: 95%; max-width: 500px; padding: 20px; border-radius: 15px; display: flex; flex-direction: column; max-height: 85vh; }
        .item-reg { display: flex; align-items: center; background: #0a0a0a; border: 1px solid #222; margin-bottom: 5px; padding: 10px; border-radius: 6px; }
        #capa-login { position: fixed; inset: 0; z-index: 99999; background: radial-gradient(circle, #000814 0%, #000000 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .login-card { background: rgba(0, 0, 0, 0.9); border: 2px solid #800020; padding: 40px; border-radius: 30px; text-align: center; box-shadow: 0 0 30px rgba(128, 0, 32, 0.6); backdrop-filter: blur(10px); width: 100%; max-width: 350px; display: flex; flex-direction: column; align-items: center; }
        .input-container { position: relative; width: 100%; max-width: 280px; margin: 0 auto; }
        #pin-input { background: #000 !important; border: 1px solid #4a0012; color: #fff; padding: 10px; padding-right: 45px; text-align: center; font-size: 20px; width: 100%; outline: none; border-radius: 12px; transition: 0.4s; font-weight: bold; box-sizing: border-box; }
        #pin-input:focus { border-color: #800020; box-shadow: 0 0 15px #800020; }
        .toggle-password { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #444; cursor: pointer; font-size: 18px; }
        #busc-reg { width: 100%; box-sizing: border-box; background: #000; border: 1px solid var(--amarillo); color: var(--amarillo); padding: 12px; margin-bottom: 15px; border-radius: 8px; outline: none; font-weight: 900; text-transform: uppercase; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 10px; display: inline-block; }
        .online { background: var(--verde); box-shadow: 0 0 8px var(--verde); }
        .offline { background: #444; }
    </style>
</head>
<body>

<div id="capa-login">

            <i class="fas fa-user-shield" style="color: #800020; font-size: 30px;"></i>

</div>

<div id="contenido-admin">

                <button class="btn-efecto" onclick="window.abrirModalPin()" style="border-color: #C71585; color: #C71585;" title="CAMBIAR CLAVE">⚙️ CLAVE</button>
                <button onclick="cerrarSesion()" class="btn-efecto" style="border-color: #A020F0; color: #A020F0;" title="CERRAR SESIÓN"><i class="fas fa-power-off"></i> SALIR</button>
            </div>
        </div>
    </div>

    <div class="layout-admin-principal">
        <div class="sidebar-conectados-admin">
            <h3>🟢 Conectados (<span id="count-conectados-admin">0</span>)</h3>
            <div id="lista-conectados-admin-view"></div>
        </div>

        <div class="main-admin-columna">
            <div class="menu-modos">
                <div class="buscador-container">
                    <input type="text" id="input-busqueda" placeholder="SELECCIONAR JUEGO..." readonly>
                    <div id="sugerencias"></div>
                    <button id="btn-aplicar-modo" class="btn-abrir" style="background:var(--verde); color:#000;">APLICAR</button>
                    <!-- BOTÓN GLOBAL PARA REABRIR SELECCIÓN EN PLENA PARTIDA -->

                    <!-- NUEVO: Selector de límite de elecciones -->
                    <div id="contenedor-limite-elecciones" style="display:none; align-items: center; gap: 5px; background: #111; padding: 5px 10px; border-radius: 8px; border: 1px solid #333;">
                        <label style="font-size: 10px; color: var(--cian); font-weight: bold;">MÁX. CARTAS:</label>
                        <input type="number" id="input-max-cartas" value="2" min="1" max="10" style="width: 45px; background: #000; border: 1px solid #555; color: #fff; text-align: center; padding: 4px; border-radius: 4px; font-weight: bold; outline: none;">
                        <button id="btn-guardar-limite" class="btn-abrir" style="background: var(--cian); color: #000; padding: 5px 10px; font-size: 10px;">GUARDAR</button>

            <div id="panel-juego" style="width:100%; margin-top:20px;"></div>
        </div>

</div>

<div id="overlay-reg" class="modal-overlay">
    <div id="modal-reg">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h2 style="color:var(--amarillo); margin:0;">REGISTRADOS</h2>
            <button onclick="cerrarRegistrados()" class="btn-efecto" style="border-color:red; color:red;">CERRAR</button>
        </div>
        
        <div style="background:#121212; padding:12px; border-radius:8px; margin-bottom:12px; border:1px solid var(--amarillo);">
            <h4 style="color:var(--amarillo); margin:0 0 8px 0; font-size:12px; text-transform:uppercase;">➕ CREAR NUEVO USUARIO</h4>
            <div style="display:flex; gap:6px; flex-wrap:wrap;">
                <input type="text" id="nuevo-nick" placeholder="NICK / USUARIO" style="flex:1; background:#000; border:1px solid #444; color:#fff; padding:8px; border-radius:6px; font-size:11px; outline:none; text-transform:uppercase;">
                <input type="text" id="nuevo-pin" placeholder="PIN" style="width:70px; background:#000; border:1px solid #444; color:#fff; padding:8px; border-radius:6px; font-size:11px; outline:none; text-align:center;">
                <select id="nuevo-sexo" style="background:#000; border:1px solid #444; color:#fff; padding:8px; border-radius:6px; font-size:11px; outline:none;">
                    <option value="H">♂ HOMBRE</option>
                    <option value="M">♀ MUJER</option>
                </select>
                <button onclick="window.crearUsuarioAdmin()" class="btn-abrir" style="background:var(--amarillo); color:#000; padding:8px 12px; font-size:11px;">CREAR</button>
            </div>
            <div id="err-crear-usr" style="color:var(--rojo); font-size:10px; margin-top:5px; font-weight:bold;"></div>
        </div>

        <div id="area-contadores" style="display:flex; gap:10px; margin-bottom:10px; background:#111; padding:10px; border-radius:8px; border:1px solid #222; justify-content:center; font-weight:900; font-size:12px;">
            <span style="color:var(--cian)">♂ HOMBRES: <span id="c-h">0</span></span>
            <span style="color:var(--rosa)">♀ MUJERES: <span id="c-m">0</span></span>
        </div>
        <input type="text" id="busc-reg" onkeyup="window.filtrarReg()" placeholder="BUSCAR POR NICK...">
        <div id="lista-usuarios" style="overflow-y:auto; flex:1;"></div>
    </div>
</div>

<div id="modal-fondo" class="modal-overlay">
    <div style="background: #0a0a0a; border: 2px solid var(--rosa); padding: 20px; border-radius: 15px; width: 380px; display: flex; flex-direction: column; box-shadow: 0 0 30px #000;">
        <h2 style="color:var(--rosa); text-align:center; margin: 0 0 15px 0; font-size: 18px;">DISEÑO DE FONDO</h2>
        <p style="font-size:10px; color:#666; margin-bottom:5px; text-transform: uppercase; font-weight: bold;">URL Imagen o Color Hex:</p>
        <input type="text" id="input-url-fondo" placeholder="https://... o #000" style="width:100%; background:#000; border:1px solid #333; color:#fff; padding:10px; border-radius:8px; margin-bottom:15px; box-sizing:border-box; outline: none;">
        <div style="display:flex; gap:10px;">
            <button onclick="guardarNuevoFondo()" class="btn-abrir" style="flex:1.5; background:var(--rosa); height: 40px; font-size: 11px;">APLICAR</button>
            <button onclick="cerrarModalFondo()" class="btn-efecto" style="flex:1; height: 40px;">CERRAR</button>
        </div>
    </div>
</div>

<div id="modal-xat" class="modal-overlay">
    <div style="background: #0a0a0a; border: 2px solid var(--cian); padding: 20px; border-radius: 15px; width: 380px; display: flex; flex-direction: column; box-shadow: 0 0 30px #000;">
        <h2 style="color:var(--cian); text-align:center; margin: 0 0 15px 0; font-size: 18px;">CONFIGURAR SALA DE XAT</h2>
        <p style="font-size:10px; color:#666; margin-bottom:5px; text-transform: uppercase; font-weight: bold;">URL de la página web (Iframe):</p>
        <input type="text" id="input-url-xat" placeholder="https://..." style="width:100%; background:#000; border:1px solid #333; color:#fff; padding:10px; border-radius:8px; margin-bottom:15px; box-sizing:border-box; outline: none;">
        <div style="display:flex; gap:10px;">
            <button onclick="guardarUrlXat()" class="btn-abrir" style="flex:1.5; background:var(--cian); color:#000; height: 40px; font-size: 11px;">GUARDAR</button>
            <button onclick="cerrarModalXat()" class="btn-efecto" style="flex:1; height: 40px;">CERRAR</button>
        </div>
    </div>
</div>

<div id="modal-cambiar-pin" class="modal-overlay">
    <div style="background: #0a0a0a; border: 2px solid var(--verde); padding: 25px; border-radius: 15px; width: 320px; display: flex; flex-direction: column; box-shadow: 0 0 30px #000;">
        <h2 style="color:var(--verde); text-align:center; margin: 0 0 10px 0; font-size: 18px;">SEGURIDAD</h2>
        <p style="font-size:10px; color:#666; text-align:center; margin-bottom: 20px; text-transform: uppercase;">Establecer nuevo PIN de acceso</p>
        <input type="text" id="nuevo-pin-input" placeholder="MÍNIMO 4 DÍGITOS" style="width:100%; background:#000; border:1px solid var(--verde); color:var(--verde); padding:12px; border-radius:10px; text-align:center; font-size:18px; margin-bottom:20px; box-sizing:border-box; outline:none; font-weight: bold;">
        <div style="display:flex; gap:10px;">
            <button onclick="guardarNuevoPin()" class="btn-abrir" style="flex:1.5; background:var(--verde); color:#000; height: 40px; font-size: 11px;">ACTUALIZAR</button>
            <button onclick="cerrarModalPin()" class="btn-efecto" style="flex:1; height: 40px;">CANCELAR</button>
        </div>
    </div>
</div>

<div id="modal-confirmar-borrar" class="modal-overlay" style="z-index: 10001;">
    <div style="background: #0a0a0a; border: 2px solid var(--rojo); padding: 25px; border-radius: 15px; width: 300px; text-align: center; box-shadow: 0 0 30px rgba(255,0,0,0.2);">
        <i class="fas fa-user-times" style="color: var(--rojo); font-size: 40px; margin-bottom: 15px;"></i>
        <h2 style="color: #fff; font-size: 16px; margin: 0 0 10px 0; text-transform: uppercase;">¿Eliminar Usuario?</h2>
        <p id="txt-confirmar-usuario" style="color: #666; font-size: 12px; margin-bottom: 20px; font-weight: bold;"></p>
        <div style="display: flex; gap: 10px;">
            <button id="btn-si-borrar" class="btn-abrir" style="flex: 1; background: var(--rojo); color: #fff; height: 35px; font-size: 11px;">ELIMINAR</button>
            <button onclick="cerrarModalBorrar()" class="btn-efecto" style="flex: 1; height: 35px; border-color: #444; color: #444;">CANCELAR</button>
        </div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc, onSnapshot, updateDoc, collection, deleteDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyBd1fw2nWohvcveNCilf6xg4xZDCNdmEQw",
    authDomain: "juegos-16e17.firebaseapp.com",
    databaseURL: "https://juegos-16e17-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "juegos-16e17",
    storageBucket: "juegos-16e17.firebasestorage.app",
    messagingSenderId: "566680151031",
    appId: "1:566680151031:web:9a400f22df8bda0e6184f2",
    measurementId: "G-YJVGWVQ3V3"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const rtdb = getDatabase(app);

window.JUEGOS_CONFIG = {
    "50": "BINGO 50", "72": "BINGO 72", "90": "BINGO 90", "100": "BINGO 100",
    "inv": "INVERTIDOS", "bingocartones": "Bingo De Cartones", "terna": "TERNAS",
    "mex": "LOTERIA MEXICANA", "pokemon": "Pokemon", "pais": "Paises", 
    "autos": "AUTOS MARCAS", "bebida": "LOTERÍA BEBIDAS", "comidas": "LOTERÍA COMIDAS",
    "fiesta": "LOTERÍA FIESTA", "pitufo": "LOTERÍA PITUFOS", "simpson": "LOS SIMPSONS", "romanos90": "ROMANOS 90",
    "lm": "LM", "nuevo": "Nuevo", "parejasuma": "Pareja Suma", "power": "POWER", "sumaindi": "Suma Indi", "sumarversus": "Sumar Versus"
};

const urlParams = new URLSearchParams(window.location.search);
const miCarpeta = urlParams.get('p') || urlParams.get('proyecto') || "gh";

let usuariosLocal = [], modoActivo = null;
let pinDeEntrada = sessionStorage.getItem(`admin_p_volatil`);
let miSesionActual = null;
let juegoActualGlobal = "50";
window.presenciaGlobal = {}; 

function normalizarTexto(txt) {
    return String(txt || "").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

document.getElementById('ver-password').onclick = function() {
    const input = document.getElementById('pin-input');
    input.type = (input.type === "password") ? "text" : "password";
    this.classList.toggle('fa-eye');
    this.classList.toggle('fa-eye-slash');
};

async function validarLoginLocal(pin) {
    try {
        const pRef = doc(db, "proyectos", miCarpeta);
        const snap = await getDoc(pRef);
        if (!snap.exists()) return { valida: false, msg: "PROYECTO NO EXISTE" };
        const data = snap.data();
        if (pin !== String(data.pinAdmin)) return { valida: false, msg: "PIN INCORRECTO" };
        return { valida: true, sessionToken: data.sessionToken || `SES_${Date.now()}` };
    } catch (e) {
        return { valida: false, msg: "ERROR DE CONEXIÓN" };
    }
}

function escucharConectadosAdmin() {
    onValue(ref(rtdb, `proyectos/${miCarpeta}/presencia`), (snapshot) => {
        const dataPresencia = snapshot.val() || {};
        
        onValue(ref(rtdb, `proyectos/${miCarpeta}/invertidosSeleccion`), (snapInv) => {
            const dataInv = snapInv.val() || {};
            onValue(ref(rtdb, `proyectos/${miCarpeta}/ternaSeleccion`), (snapTerna) => {
                const dataTerna = snapTerna.val() || {};
                onValue(ref(rtdb, `proyectos/${miCarpeta}/sumarversusSeleccion`), (snapVersus) => {
                    const dataVersus = snapVersus.val() || {};
                    onValue(ref(rtdb, `proyectos/${miCarpeta}/mexSeleccion`), (snapMex) => {
                        const dataMex = snapMex.val() || {};
                        onValue(ref(rtdb, `proyectos/${miCarpeta}/pokemonSeleccion`), (snapPoke) => {
                            const dataPoke = snapPoke.val() || {};
                            onValue(ref(rtdb, `proyectos/${miCarpeta}/paisSeleccion`), (snapPais) => {
                                const dataPais = snapPais.val() || {};
                                onValue(ref(rtdb, `proyectos/${miCarpeta}/autosSeleccion`), (snapAutos) => {
                                    const dataAutos = snapAutos.val() || {};
                                    onValue(ref(rtdb, `proyectos/${miCarpeta}/bebidaSeleccion`), (snapBebida) => {
                                        const dataBebida = snapBebida.val() || {};
                                        onValue(ref(rtdb, `proyectos/${miCarpeta}/comidasSeleccion`), (snapComidas) => {
                                            const dataComidas = snapComidas.val() || {};
                                            onValue(ref(rtdb, `proyectos/${miCarpeta}/fiestaSeleccion`), (snapFiesta) => {
                                                const dataFiesta = snapFiesta.val() || {};
                                                onValue(ref(rtdb, `proyectos/${miCarpeta}/pitufoSeleccion`), (snapPitufo) => {
                                                    const dataPitufo = snapPitufo.val() || {};
                                                    onValue(ref(rtdb, `proyectos/${miCarpeta}/simpsonSeleccion`), (snapSimp) => {
                                                        const dataSimp = snapSimp.val() || {};
                                                        onValue(ref(rtdb, `proyectos/${miCarpeta}/powerSeleccion`), (snapPow) => {
                                                            const dataPow = snapPow.val() || {};

                                                            onValue(ref(rtdb, `proyectos/${miCarpeta}/sorteos/${juegoActualGlobal}`), (snapSorteo) => {
                                                                const infoSorteo = snapSorteo.val() || {};
                                                                const rawSalidos = infoSorteo.sacados || [];
                                                                const sacados = Array.isArray(rawSalidos) 
                                                                    ? rawSalidos.map(s => normalizarTexto(s)) 
                                                                    : Object.values(rawSalidos).map(s => normalizarTexto(s));
                                                                
                                                                const contenedorLista = document.getElementById('lista-conectados-admin-view');
                                                                const contadorElem = document.getElementById('count-conectados-admin');
                                                                
                                                                let html = "";
                                                                let totalOnline = 0;

                                                                Object.keys(dataPresencia).forEach(nick => {
                                                                    if (dataPresencia[nick] && dataPresencia[nick].estado === 'online') {
                                                                        totalOnline++;
                                                                        let badgeHtml = "";
                                                                        
                                                                        const juegoLower = String(juegoActualGlobal).toLowerCase();

                                                                        if (juegoLower === 'inv') {
                                                                            const seleccionUser = dataInv[nick] ? dataInv[nick].par : null;
                                                                            if (seleccionUser) {
                                                                                let partes = seleccionUser.split("-");
                                                                                let p1 = partes[0].trim();
                                                                                let p2 = partes[1].trim();
                                                                                let class1 = sacados.includes(normalizarTexto(p1)) ? "num-inv-rojo" : "";
                                                                                let class2 = sacados.includes(normalizarTexto(p2)) ? "num-inv-rojo" : "";
                                                                                badgeHtml = `<span class="badge-invertido"><span class="${class1}">${p1}</span>-<span class="${class2}">${p2}</span></span>`;
                                                                            } else {
                                                                                badgeHtml = `<span class="badge-invertido" style="color:#666;">SIN SELECCIONAR</span>`;
                                                                            }
                                                                        } else if (juegoLower === 'terna') {
                                                                            const seleccionTerna = dataTerna[nick] ? dataTerna[nick].terna : null;
                                                                            if (seleccionTerna) {
                                                                                let partes = seleccionTerna.split("-");
                                                                                let t1 = partes[0].trim(), t2 = partes[1].trim(), t3 = partes[2].trim();
                                                                                let c1 = sacados.includes(normalizarTexto(t1)) ? "num-inv-rojo" : "";
                                                                                let c2 = sacados.includes(normalizarTexto(t2)) ? "num-inv-rojo" : "";
                                                                                let c3 = sacados.includes(normalizarTexto(t3)) ? "num-inv-rojo" : "";
                                                                                badgeHtml = `<span class="badge-invertido"><span class="${c1}">${t1}</span>-<span class="${c2}">${t2}</span>-<span class="${c3}">${t3}</span></span>`;
                                                                            } else {
                                                                                badgeHtml = `<span class="badge-invertido" style="color:#666;">SIN SELECCIONAR</span>`;
                                                                            }
                                                                        } else if (juegoLower === 'sumarversus') {
                                                                            const eqUser = dataVersus[nick] ? dataVersus[nick].equipo : null;
                                                                            if (eqUser) {
                                                                                let colorEq = eqUser === 'A' ? 'var(--cian)' : 'var(--rosa)';
                                                                                badgeHtml = `<span class="badge-invertido" style="color: ${colorEq}; border-color: ${colorEq};">EQUIPO ${eqUser}</span>`;
                                                                            } else {
                                                                                badgeHtml = `<span class="badge-invertido" style="color:#666;">SIN EQUIPO</span>`;
                                                                            }
                                                                        } else if (['mex', 'pokemon', 'pais', 'autos', 'bebida', 'comidas', 'fiesta', 'pitufo', 'simpson', 'power'].includes(juegoLower)) {
                                                                            let datasetActual = {};
                                                                            if (juegoLower === 'mex') datasetActual = dataMex;
                                                                            else if (juegoLower === 'pokemon') datasetActual = dataPoke;
                                                                            else if (juegoLower === 'pais') datasetActual = dataPais;
                                                                            else if (juegoLower === 'autos') datasetActual = dataAutos;
                                                                            else if (juegoLower === 'bebida') datasetActual = dataBebida;
                                                                            else if (juegoLower === 'comidas') datasetActual = dataComidas;
                                                                            else if (juegoLower === 'fiesta') datasetActual = dataFiesta;
                                                                            else if (juegoLower === 'pitufo') datasetActual = dataPitufo;
                                                                            else if (juegoLower === 'simpson') datasetActual = dataSimp;
                                                                            else if (juegoLower === 'power') datasetActual = dataPow;

                                                                            const cartasUser = (datasetActual[nick] && Array.isArray(datasetActual[nick].cartas)) ? datasetActual[nick].cartas : [];
                                                                            if (cartasUser.length > 0) {
                                                                                let cartasHtmlArr = cartasUser.map(c => {
                                                                                    let cClean = String(c).trim();
                                                                                    let claseSalida = sacados.includes(normalizarTexto(cClean)) ? "num-inv-rojo" : "";
                                                                                    return `<span class="${claseSalida}">${cClean}</span>`;
                                                                                });
                                                                                badgeHtml = `<span class="badge-invertido">${cartasHtmlArr.join(', ')}</span>`;
                                                                            } else {
                                                                                badgeHtml = `<span class="badge-invertido" style="color:#666;">SIN CARTAS</span>`;
                                                                            }
                                                                        }

                                                                        html += `
                                                                        <div class="item-conectado">
                                                                            <div style="display:flex; align-items:center; gap:6px; width: 100%;">
                                                                                <span class="punto-online"></span>
                                                                                <span style="font-weight: bold; text-transform: uppercase; color: #fff; word-break: break-all;">${nick}</span>
                                                                            </div>
                                                                            ${badgeHtml}
                                                                        </div>`;
                                                                    }
                                                                });

                                                                if (contadorElem) contadorElem.innerText = totalOnline;
                                                                if (contenedorLista) {
                                                                    contenedorLista.innerHTML = html || '<div style="color: #555; font-size: 11px; text-align: center; padding: 10px;">Nadie conectado</div>';
                                                                }
                                                            });
                                                        });
                                                    });
                                                });
                                            });
                                        });
                                    });
                                });
                            });
                        });
                    });
                });
            });
        });
    });
}

function arrancarTodo() {
    document.getElementById('contenido-admin').style.display = 'flex';
    document.getElementById('capa-login').style.display = 'none';
    const refProy = doc(db, "proyectos", miCarpeta);

    escucharConectadosAdmin();

    onValue(ref(rtdb, `proyectos/${miCarpeta}/presencia`), (snap) => {
        window.presenciaGlobal = snap.val() || {};
        window.renderUsuarios(usuariosLocal);
    });

    onSnapshot(refProy, (snap) => {
        const d = snap.data();
        if(!d) return;

        window.misJuegosDB = d.juegos || [];           

        if (miSesionActual === null) miSesionActual = d.sessionToken;

        if(d.fondoPersonalizado) {
            document.body.style.background = d.fondoPersonalizado.includes('http') 
                ? `url('${d.fondoPersonalizado}') center/cover no-repeat fixed` 
                : d.fondoPersonalizado;
        }

        if(d.urlXat) {
            document.getElementById('input-url-xat').value = d.urlXat;
        }

        const juegoActivoLimpio = d.juegoActivo ? String(d.juegoActivo).trim() : null;
        
        const juegosConSeleccionAdmin = ['mex', 'pokemon', 'pais', 'autos', 'bebida', 'comidas', 'fiesta', 'pitufo', 'simpson', 'power'];
        const btnReabrir = document.getElementById('btn-reabrir-seleccion');
        const contenedorLimite = document.getElementById('contenedor-limite-elecciones');
        const inputMaxCartas = document.getElementById('input-max-cartas');

        if (juegosConSeleccionAdmin.includes(juegoActivoLimpio)) {
            btnReabrir.style.display = 'block';
            contenedorLimite.style.display = 'flex';
            if (d.maxSelecciones) {
                inputMaxCartas.value = d.maxSelecciones;
            }
        } else {
            btnReabrir.style.display = 'none';
            contenedorLimite.style.display = 'none';
        }

        if(juegoActivoLimpio && modoActivo !== juegoActivoLimpio) { 
            modoActivo = juegoActivoLimpio; 
            juegoActualGlobal = juegoActivoLimpio;
            escucharConectadosAdmin();
            cargarMod(juegoActivoLimpio); 
        }
    });

    onSnapshot(collection(db, "proyectos", miCarpeta, "registrados"), (snap) => {
        usuariosLocal = []; let h = 0, m = 0;
        snap.forEach(u => { 
            const ud = u.data(); ud.id = u.id; usuariosLocal.push(ud); 
            if(ud.sexo === 'H' || ud.genero === 'HOMBRE') h++; else m++; 
        });
        document.getElementById('count-total').innerText = snap.size;
        document.getElementById('c-h').innerText = h; 
        document.getElementById('c-m').innerText = m;
        window.renderUsuarios(usuariosLocal);
    });
}

window.renderUsuarios = (lista) => {
    document.getElementById('lista-usuarios').innerHTML = lista.map(u => {
        const esH = (u.sexo === 'H' || u.genero === 'HOMBRE');
        const colorG = esH ? 'var(--cian)' : 'var(--rosa)';
        const nickKey = (u.nick || u.id || "").trim().toLowerCase();
        const estadoUsr = window.presenciaGlobal[nickKey] || { estado: 'offline' };
        const esOnline = estadoUsr.estado === 'online';
        const claseEstado = esOnline ? 'online' : 'offline';

        return `
        <div class="item-reg" style="border-left: 4px solid ${colorG}; background:#080808; padding:12px; margin-bottom:10px; border-radius:8px; display:flex; align-items:center;">
            <span class="status-dot ${claseEstado}" title="${esOnline ? 'CONECTADO' : 'DESCONECTADO'}"></span>
            <span onclick="window.cambiarSexo('${u.id}', '${u.sexo || (esH?'H':'M')}')" style="color:${colorG}; font-size:26px; cursor:pointer; width:45px; text-align:center;">
                ${esH ? '♂' : '♀'}
            </span>
            <div style="flex:1; margin-left:12px;">
                <div style="font-weight:900; font-size:16px; text-transform:uppercase;">${u.nick || u.id}</div>
                <div style="font-size:11px; margin-top:2px;">
                    <span>PIN: ${u.pin || '----'}</span> | <span style="color:${esOnline ? 'var(--verde)' : '#666'}">${esOnline ? 'ONLINE' : 'OFFLINE'}</span>
                </div>
            </div>
            <button onclick="window.borrarU('${u.id}')" style="border:1px solid var(--rojo); color:var(--rojo); background:none; font-size:9px; padding:8px 12px; border-radius:5px; cursor:pointer;">ELIMINAR</button>
        </div>`;
    }).join('');
};

window.filtrarReg = () => {
    const bus = document.getElementById('busc-reg').value.toUpperCase();
    const filtrados = usuariosLocal.filter(u => (u.nick || "").toUpperCase().includes(bus) || u.id.includes(bus));
    window.renderUsuarios(filtrados);
};

window.crearUsuarioAdmin = async () => {
    const nick = document.getElementById('nuevo-nick').value.trim().toUpperCase();
    const pin = document.getElementById('nuevo-pin').value.trim();
    const sexo = document.getElementById('nuevo-sexo').value;
    const errDiv = document.getElementById('err-crear-usr');

    if (!nick || !pin) { errDiv.innerText = "COMPLETA NICK Y PIN"; return; }

    try {
        const userRef = doc(db, "proyectos", miCarpeta, "registrados", nick);
        await setDoc(userRef, { nick: nick, pin: pin, sexo: sexo, genero: sexo === 'H' ? 'HOMBRE' : 'MUJER', creado: Date.now() });
        document.getElementById('nuevo-nick').value = '';
        document.getElementById('nuevo-pin').value = '';
        errDiv.innerText = "";
        alert("¡Usuario creado con éxito!");
    } catch (e) { errDiv.innerText = "ERROR AL CREAR USUARIO"; }
};

window.abrirModalFondo = () => document.getElementById('modal-fondo').style.display = 'flex';
window.cerrarModalFondo = () => document.getElementById('modal-fondo').style.display = 'none';
window.abrirModalXat = () => document.getElementById('modal-xat').style.display = 'flex';
window.cerrarModalXat = () => document.getElementById('modal-xat').style.display = 'none';

window.guardarUrlXat = async () => {
    const url = document.getElementById('input-url-xat').value.trim();
    await updateDoc(doc(db, "proyectos", miCarpeta), { urlXat: url });
    cerrarModalXat();
};

window.abrirPantallaJugador = () => {
    window.open(`pantalla_jugador.html?p=${miCarpeta}`, "PantallaJugador", "width=1750,height=850");
};

window.guardarNuevoFondo = async () => { 
    const url = document.getElementById('input-url-fondo').value.trim(); 
    if(url) { await updateDoc(doc(db, "proyectos", miCarpeta), { fondoPersonalizado: url }); cerrarModalFondo(); } 
};

window.abrirModalPin = () => document.getElementById('modal-cambiar-pin').style.display = 'flex';
window.cerrarModalPin = () => document.getElementById('modal-cambiar-pin').style.display = 'none';
window.guardarNuevoPin = async () => { 
    const p = document.getElementById('nuevo-pin-input').value.trim(); 
    if(p.length >= 4){ await updateDoc(doc(db, "proyectos", miCarpeta), { pinAdmin: p }); sessionStorage.setItem(`admin_p_volatil`, p); location.reload(); } 
};

window.cambiarSexo = async (id, s) => { 
    const nS = s==='H'?'M':'H'; await updateDoc(doc(db, "proyectos", miCarpeta, "registrados", id), { sexo: nS, genero: nS==='H'?'HOMBRE':'MUJER' }); 
};

let usuarioAEliminar = null;
window.borrarU = (id) => { usuarioAEliminar = id; document.getElementById('txt-confirmar-usuario').innerText = "ID: " + id; document.getElementById('modal-confirmar-borrar').style.display = 'flex'; };
window.cerrarModalBorrar = () => document.getElementById('modal-confirmar-borrar').style.display = 'none';

document.getElementById('btn-si-borrar').onclick = async () => {
    if (usuarioAEliminar) { await deleteDoc(doc(db, "proyectos", miCarpeta, "registrados", usuarioAEliminar)); cerrarModalBorrar(); }
};

window.cerrarRegistrados = () => document.getElementById('overlay-reg').style.display = 'none';
document.getElementById('btn-ver-reg-top').onclick = () => document.getElementById('overlay-reg').style.display = 'flex';

let tempJuego = null;

const inputBusqueda = document.getElementById('input-busqueda');
const sugerenciasDiv = document.getElementById('sugerencias');

inputBusqueda.onclick = (e) => {
    e.stopPropagation();
    if (sugerenciasDiv.style.display === 'block') {
        sugerenciasDiv.style.display = 'none';
    } else {
        const listaJuegos = (window.misJuegosDB && window.misJuegosDB.length > 0) ? window.misJuegosDB : Object.keys(window.JUEGOS_CONFIG);
        sugerenciasDiv.innerHTML = listaJuegos.map(id => {
            const idLimpio = String(id).trim();
            const nombreLindo = window.JUEGOS_CONFIG[idLimpio] || idLimpio.toUpperCase();
            return `<div class="sug-item" onclick="window.seleccionarJuego('${idLimpio}')">${nombreLindo}</div>`;
        }).join('');
        sugerenciasDiv.style.display = 'block';
    }
};

document.addEventListener('click', (e) => {
    if (!document.querySelector('.buscador-container').contains(e.target)) {
        sugerenciasDiv.style.display = 'none';
    }
});

window.seleccionarJuego = (id) => {
    tempJuego = String(id).trim(); 
    inputBusqueda.value = window.JUEGOS_CONFIG[tempJuego] || tempJuego.toUpperCase();
    sugerenciasDiv.style.display = 'none';
};

document.getElementById('btn-aplicar-modo').onclick = async () => {
    if (tempJuego) {
        await updateDoc(doc(db, "proyectos", miCarpeta), { 
            juegoActivo: tempJuego, 
            estadoInvertidosComenzado: false, 
            estadoMexComenzado: false, 
            estadoPokemonComenzado: false, 
            estadoPaisComenzado: false,
            estadoAutosComenzado: false,
            estadoBebidaComenzado: false,
            estadoComidasComenzado: false,
            estadoFiestaComenzado: false,
            estadoPitufoComenzado: false,
            estadoSimpsonComenzado: false,
            estadoPowerComenzado: false,
            estadoTernaComenzado: false 
        });
    }
};

document.getElementById('btn-reabrir-seleccion').onclick = async () => {
    if (!modoActivo) return;
    
    let campoEstado = "";
    if (modoActivo === 'inv') campoEstado = "estadoInvertidosComenzado";
    else if (modoActivo === 'terna') campoEstado = "estadoTernaComenzado";
    else campoEstado = `estado${modoActivo.charAt(0).toUpperCase() + modoActivo.slice(1)}Comenzado`;

    if (confirm(`¿Deseas reabrir la fase de selección para el juego ${modoActivo.toUpperCase()} sin perder las bolas extraídas?`)) {
        let objUpdate = {};
        objUpdate[campoEstado] = false; 
        await updateDoc(doc(db, "proyectos", miCarpeta), objUpdate);
        alert("¡Selección reabierta con éxito! Los jugadores ya pueden elegir sus opciones.");
    }
};

document.getElementById('btn-guardar-limite').onclick = async () => {
    const nuevoLimite = parseInt(document.getElementById('input-max-cartas').value) || 2;
    await updateDoc(doc(db, "proyectos", miCarpeta), { maxSelecciones: nuevoLimite });
    alert(`¡Límite actualizado a ${nuevoLimite} opciones por jugador!`);
};

window.cerrarSesion = () => { sessionStorage.clear(); location.reload(); };

async function cargarMod(m) { 
    const p = document.getElementById('panel-juego'); 
    if (!m) return;
    const juegoLimpio = String(m).trim();
    const rutaModulo = `./modulos/admin_${encodeURIComponent(juegoLimpio)}.js?v=${Date.now()}`;
    try { 
        const mod = await import(rutaModulo); 
        if (mod && mod.iniciar) { p.innerHTML = ''; mod.iniciar(p, db, miCarpeta, rtdb); } 
    } catch(e) { 
        p.innerHTML = `<div style="color:var(--rojo); text-align:center; padding:20px;">⚠️ El módulo "admin_${juegoLimpio}.js" no existe o no tiene exportación válida.</div>`;
    }
}

if (pinDeEntrada) arrancarTodo();
else document.getElementById('capa-login').style.display = 'flex';

async function intentarLogin() {
    const pinIn = document.getElementById('pin-input').value;
    const res = await validarLoginLocal(pinIn);
    if (res.valida) { sessionStorage.setItem(`admin_p_volatil`, pinIn); location.reload(); } 
    else { document.getElementById('err-log').innerText = res.msg; }
}

document.getElementById('btn-login').onclick = intentarLogin;

document.getElementById('pin-input').onkeydown = (e) => {
    if (e.key === 'Enter') {
        intentarLogin();
    }
};
</script>
</body>
</html>
