<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Sorteadores</title>

    <style>
        :root {
            --fondo: #121212;
            --verde: #39ff14;
            --amarillo: #ffcc00;
            --cian: #00f3ff;
            --rojo: #ff0000;
            --violeta: #bc13fe;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            color: #ffffff;
            background: #000;
            transition: background 0.5s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* CAPA DE LOGIN */
        #capa-login {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: radial-gradient(circle, #000814 0%, #000000 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #800020;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 0 30px rgba(128, 0, 32, 0.6);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .input-container {
            position: relative;
            width: 100%;
            max-width: 280px;
            margin: 0 auto;
        }
        #pin-input {
            background: #000 !important;
            border: 1px solid #4a0012;
            color: #fff;
            padding: 10px;
            padding-right: 45px;
            text-align: center;
            font-size: 20px;
            width: 100%;
            outline: none;
            border-radius: 12px;
            transition: 0.4s;
            font-weight: bold;
            box-sizing: border-box;
        }
        #pin-input:focus {
            border-color: #800020;
            box-shadow: 0 0 15px #800020;
        }
        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #444;
            cursor: pointer;
            font-size: 18px;
        }

        #contenido-admin {
            width: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(5, 5, 5, 0.9);
            padding: 15px 25px;
            border-radius: 12px;
            margin: 20px 0;
            width: 95%;
            max-width: 1150px;
            box-sizing: border-box;
            backdrop-filter: blur(5px);
            border-bottom: 1px solid #151515;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-acciones {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn-panel {
            background: #2196F3;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
            transition: 0.3s;
        }
        .btn-panel:hover { opacity: 0.85; transform: translateY(-1px); }

        .panel-controles {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            width: 95%;
            max-width: 1150px;
        }

        select, input {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #222;
            color: #fff;
            outline: none;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-contenido {
            background: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .tarjeta-usuario {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #2a2a2a;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .btn-eliminar {
            background: var(--rojo);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-sexo {
            cursor: pointer;
            font-size: 1.2rem;
            margin-right: 10px;
        }

        .panel-tablero-sorteador {
            background: #0f0f0f;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            width: 95%;
            max-width: 1150px;
            box-sizing: border-box;
            box-shadow: 0 8px 25px rgba(0,0,0,0.8);
        }
        .info-tablero-sort {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #888;
            margin-bottom: 12px;
            font-weight: bold;
        }

            display: grid;
            gap: 6px;
            width: 100%;
        }

            background: #121212;
            color: #666;
            padding: 12px 4px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            font-size: 11px;
            border: 1px solid #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
        }

            background: var(--verde);
            color: #000;
            box-shadow: 0 0 12px rgba(57, 255, 20, 0.6);
            border-color: #fff;
        }
    </style>

    <!-- CAPA DE LOGIN -->
    <div id="capa-login">
        <div class="login-card">
            <div style="width: 70px; height: 70px; background: rgba(128, 0, 32, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; border: 1px solid #800020;">
                <i class="fas fa-user-shield" style="color: #800020; font-size: 30px;"></i>
            </div>
            <h1 style="color:#fff; font-size:16px; margin-bottom:30px; letter-spacing: 3px; font-weight: 900;">ACCESO <span style="color:#800020">RESTRINGIDO</span></h1>
            <div class="input-container">
                <input type="password" id="pin-input" placeholder="••••" autocomplete="off">
                <i class="fas fa-eye toggle-password" id="ver-password"></i>
            </div>
            <button id="btn-login" style="width:100%; max-width:280px; background:#800020; color:#fff; margin:20px auto 0; border-radius: 12px; height: 45px; font-size: 13px; box-shadow: 0 0 15px rgba(128, 0, 32, 0.5); border:none; cursor:pointer; font-weight:bold;">INGRESAR</button>
            <div id="err-log" style="color:var(--rojo); margin-top:15px; font-size: 11px; font-weight:bold; text-transform: uppercase;"></div>
        </div>
    </div>

    <!-- CONTENIDO PRINCIPAL DEL PANEL -->
    <div id="contenido-admin">

            <h2>🎮 PANEL ADMINISTRADOR</h2>
            <div class="header-acciones">

                <button id="btn-auto" class="btn-panel" style="background: #FF9800;" onclick="ejecutarAccionJuego('auto')"><i class="fas fa-bolt"></i> AUTO</button>
                <select id="select-tiempo-auto" class="btn-panel" style="background: #222; color: #fff; border: 1px solid #555; cursor: pointer;">
                    <option value="1000">1s</option>
                    <option value="2000">2s</option>
                    <option value="3000" selected>3s</option>
                    <option value="5000">5s</option>
                    <option value="10000">10s</option>
                </select>
                <button id="btn-pausar" class="btn-panel" style="background: #9C27B0;" onclick="ejecutarAccionJuego('pausar')"><i class="fas fa-pause"></i> PAUSAR</button>
                <button id="btn-reiniciar" class="btn-panel" style="background: #f44336;" onclick="ejecutarAccionJuego('reiniciar')"><i class="fas fa-redo"></i> REINICIAR</button>
                <button id="btnRegistrados" class="btn-panel" style="background: #2196F3;" onclick="abrirModalRegistrados()"><i class="fas fa-users"></i> REGISTRADOS (0)</button>
            </div>
        </header>

        <div class="panel-controles">
            <div>
                <label>Sorteador Actual:</label>
                <select id="selectSorteadores" onchange="cambiarSorteador(this.value)">
                    <option value="">Cargando sorteadores...</option>
                </select>
            </div>

            <div>
                <label>Juegos Habilitados:</label>
                <select id="selectJuegos" onchange="cargarModuloJuego(this.value)">
                    <option value="">Seleccionar juego...</option>
                </select>
            </div>
        </div>

        <main id="contenedorJuego" style="width: 95%; max-width: 1150px; display: flex; flex-direction: column; align-items: center;">
            <h3>Selecciona un juego para iniciar...</h3>

                    <input type="text" id="sort-nuevo-pin" placeholder="PIN" style="width:80px; padding:8px; font-size:12px; text-align:center;">
                    <select id="sort-nuevo-sexo" style="padding:8px; font-size:12px;">
                        <option value="H">♂ HOMBRE</option>

                    </select>
                    <button class="btn-panel" style="background:#4CAF50; padding:8px 14px; font-size:12px;" onclick="crearUsuarioDesdeSorteador()">Crear</button>

                <div id="sort-err-usr" style="color:var(--rojo); font-size:11px; margin-top:5px; font-weight:bold;"></div>

            <button class="btn-panel" style="background:#555" onclick="cerrarModalRegistrados()">Cerrar</button>

    </div>

        // Lógica de Acciones para los botones de cabecera
        window.ejecutarAccionJuego = async function(accion) {
            if (!juegoActualGlobal) {
                alert("Selecciona un juego primero.");
                return;
            }

            const juegoRef = ref(rtdb, `proyectos/${idProyecto}/sorteos/${juegoActualGlobal}`);
            
            if (accion === 'reiniciar') {
                if (intervaloAuto) clearInterval(intervaloAuto);
                await set(juegoRef, { sacados: [], ultimo: "--" });
                return;
            }

            if (accion === 'pausar') {
                if (intervaloAuto) {
                    clearInterval(intervaloAuto);
                    intervaloAuto = null;
                }
                return;
            }

            const snap = await new Promise(resolve => onValue(juegoRef, resolve, { onlyOnce: true }));
            const info = snap.val() || {};
            const rawSacados = info.sacados || [];
            const sacados = Array.isArray(rawSacados) ? rawSacados : Object.values(rawSacados);

            const juegoLower = String(juegoActualGlobal).toLowerCase();
            let disponibles = [];

            if (listasJuegos[juegoLower]) {
                disponibles = listasJuegos[juegoLower].filter(el => !sacados.includes(el));
            } else {
                let totalNums = 50;
                if (juegoLower === '72' || juegoLower === 'bingo72') totalNums = 72;
                else if (juegoLower === '90' || juegoLower === 'bingo90') totalNums = 90;
                else if (juegoLower === '100' || juegoLower === 'bingo100') totalNums = 100;
                else if (juegoLower === 'eliminatorias') totalNums = 30;

                for (let i = 1; i <= totalNums; i++) {
                    if (!sacados.includes(i) && !sacados.includes(String(i))) disponibles.push(i);
                }
            }

            const sacarSiguiente = async () => {
                if (disponibles.length === 0) {
                    if (intervaloAuto) clearInterval(intervaloAuto);
                    return;
                }
                const randomIndex = Math.floor(Math.random() * disponibles.length);
                const elegido = disponibles.splice(randomIndex, 1)[0];
                sacados.push(elegido);

                await update(juegoRef, {
                    sacados: sacados,
                    ultimo: elegido
                });
            };

            if (accion === 'extraer') {
                await sacarSiguiente();
            } else if (accion === 'auto') {
                if (intervaloAuto) clearInterval(intervaloAuto);
                const tiempoMilis = parseInt(document.getElementById('select-tiempo-auto').value) || 3000;

                    const sSnap = await new Promise(r => onValue(juegoRef, r, { onlyOnce: true }));
                    const sInfo = sSnap.val() || {};
                    const sSacados = Array.isArray(sInfo.sacados) ? sInfo.sacados : Object.values(sInfo.sacados || {});
                    
                    let dispActuales = [];
                    if (listasJuegos[juegoLower]) {
                        dispActuales = listasJuegos[juegoLower].filter(el => !sSacados.includes(el));
                    } else {
                        let tNums = 50;
                        if (juegoLower === '72' || juegoLower === 'bingo72') tNums = 72;
                        else if (juegoLower === '90' || juegoLower === 'bingo90') tNums = 90;
                        else if (juegoLower === '100' || juegoLower === 'bingo100') tNums = 100;
                        else if (juegoLower === 'eliminatorias') tNums = 30;

                        for (let i = 1; i <= tNums; i++) {
                            if (!sSacados.includes(i) && !sSacados.includes(String(i))) dispActuales.push(i);
                        }
                    }

                    if (dispActuales.length === 0) {
                        clearInterval(intervaloAuto);
                        intervaloAuto = null;
                        return;
                    }
                    const rnd = Math.floor(Math.random() * dispActuales.length);
                    const elElegido = dispActuales.splice(rnd, 1)[0];
                    sSacados.push(elElegido);

                    await update(juegoRef, {
                        sacados: sSacados,
                        ultimo: elElegido
                    });
                }, tiempoMilis);
            }
        };

        // Verificador de PIN
        document.getElementById('ver-password').onclick = function() {
            const input = document.getElementById('pin-input');
            input.type = (input.type === "password") ? "text" : "password";
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        };

        async function validarLoginLocal(pin) {
            try {
                const pRef = doc(db, "proyectos", idProyecto);
                const snap = await getDoc(pRef);
                if (!snap.exists()) return { valida: false, msg: "PROYECTO NO EXISTE" };
                const data = snap.data();
                if (pin !== String(data.pinAdmin)) return { valida: false, msg: "PIN INCORRECTO" };
                return { valida: true };
            } catch (e) {
                return { valida: false, msg: "ERROR DE CONEXIÓN" };
            }
        }

        document.getElementById('btn-login').onclick = async () => {
            const pinIn = document.getElementById('pin-input').value;
            const res = await validarLoginLocal(pinIn);
            if (res.valida) {
                sessionStorage.setItem(`admin_sorteador_volatil_${idProyecto}`, pinIn);
                arrancarTodo();
            } else {
                document.getElementById('err-log').innerText = res.msg;
            }
        };

        if (pinDeEntrada) {
            validarLoginLocal(pinDeEntrada).then(res => {
                if (res.valida) arrancarTodo();
                else document.getElementById('capa-login').style.display = 'flex';
            });
        }

        function arrancarTodo() {
            document.getElementById('contenido-admin').style.display = 'flex';
            document.getElementById('capa-login').style.display = 'none';

            const docRef = doc(db, "proyectos", idProyecto);

            onSnapshot(docRef, (docSnap) => {
                if (!docSnap.exists()) return;
                const data = docSnap.data();

                if (data.fondoPersonalizado) {
                    document.body.style.background = data.fondoPersonalizado.includes('http') 
                        ? `url('${data.fondoPersonalizado}') center/cover no-repeat fixed` 
                        : data.fondoPersonalizado;
                }

                if (Array.isArray(data.sorteadores)) {
                    actualizarMenuSorteadores(data.sorteadores);
                }

                if (Array.isArray(data.juegos)) {
                    actualizarMenuJuegos(data.juegos);
                }

                if (data.juegoActivo && juegoActualGlobal !== data.juegoActivo) {
                    cargarModuloJuego(data.juegoActivo, false);
                    const selJuegos = document.getElementById("selectJuegos");
                    if (selJuegos) selJuegos.value = data.juegoActivo;
                }
            });

            escucharRegistrados();
        }

        function actualizarMenuSorteadores(lista) {
            const select = document.getElementById("selectSorteadores");
            if (!select) return;
            select.innerHTML = '<option value="">-- Seleccionar Sorteador --</option>';
            lista.forEach(id => {
                const opt = document.createElement("option");
                opt.value = id;
                opt.textContent = id.toUpperCase();
                select.appendChild(opt);
            });
        }

        function actualizarMenuJuegos(lista) {
            const select = document.getElementById("selectJuegos");
            if (!select) return;
            select.innerHTML = '<option value="">-- Seleccionar Juego --</option>';
            lista.forEach(id => {
                const opt = document.createElement("option");
                opt.value = id;
                opt.textContent = id.toUpperCase();
                select.appendChild(opt);
            });
        }

        window.cargarModuloJuego = async function(idJuego, actualizarFirestore = true) {
            if (!idJuego) return;
            juegoActualGlobal = idJuego;
            
            if (actualizarFirestore) {
                try {
                    await updateDoc(doc(db, "proyectos", idProyecto), { juegoActivo: idJuego });
                } catch (err) {
                    console.error("Error al sincronizar juego activo:", err);
                }
            }

            const contenedor = document.getElementById("contenedorJuego");
            if (!contenedor) return;
            contenedor.innerHTML = `<h3>Cargando módulo: admin_${idJuego}.js ...</h3>`;

            if (unsubscribeSorteoRTDB) unsubscribeSorteoRTDB();
            const sorteoRef = ref(rtdb, `proyectos/${idProyecto}/sorteos/${idJuego}`);
            unsubscribeSorteoRTDB = onValue(sorteoRef, (snapshot) => {
                const info = snapshot.val() || {};
                const rawSacados = info.sacados || [];
                const sacados = Array.isArray(rawSacados) ? rawSacados : Object.values(rawSacados);
                renderizarTableroEnSorteador(idJuego, sacados);
            });

            try {
                const modulo = await import(`./modulos/admin_${idJuego}.js?v=${Date.now()}`);
                if (modulo && (modulo.iniciar || modulo.init)) {
                    contenedor.innerHTML = "";
                    
                    const divControles = document.createElement("div");
                    divControles.style.width = "100%";
                    const fn = modulo.iniciar || modulo.init;
                    fn(divControles, db, idProyecto, rtdb);
                    contenedor.appendChild(divControles);

                    const divTablero = document.createElement("div");
                    divTablero.id = "contenedor-tablero-dinamico";
                    divTablero.style.width = "100%";
                    contenedor.appendChild(divTablero);

                } else {
                    contenedor.innerHTML = `<h3>Módulo admin_${idJuego}.js activo.</h3><div id="contenedor-tablero-dinamico"></div>`;
                }
            } catch (err) {
                console.error("Error cargando módulo:", err);
                contenedor.innerHTML = `<h3>Juego activo: ${idJuego.toUpperCase()}</h3><div id="contenedor-tablero-dinamico"></div>`;
            }
        };

        function renderizarTableroEnSorteador(juego, sacados) {
            let divTablero = document.getElementById("contenedor-tablero-dinamico");
            if (!divTablero) return;

            const juegoLower = String(juego).toLowerCase();
            let html = `
                <div class="panel-tablero-sorteador">
                    <div class="info-tablero-sort">
                        <span>TABLERO EN VIVO: ${juego.toUpperCase()}</span>
                        <span>EXTRAÍDAS: ${sacados.length}</span>
                    </div>
                    <div id="tablero-grid-sorteador"></div>
                </div>
            `;
            divTablero.innerHTML = html;

            const grid = document.getElementById("tablero-grid-sorteador");
            if (!grid) return;

            let gridHtml = "";

            if (listasJuegos[juegoLower]) {
                const elementos = listasJuegos[juegoLower];
                elementos.forEach((el, index) => {
                    const esta = sacados.includes(el);
                    const prefijoNum = juegoLower === 'pokemon' ? `#${index + 1} ` : '';
                    gridHtml += `<div class="celda-sort ${esta ? 'marcada' : ''}" style="font-size: 10px; padding: 10px 2px;">${prefijoNum}${el}</div>`;
                });
                grid.style.gridTemplateColumns = juegoLower === 'pokemon' ? "repeat(auto-fill, minmax(105px, 1fr))" : "repeat(auto-fill, minmax(115px, 1fr))";
                grid.innerHTML = gridHtml;
                return;
            }

            let totalNums = 50;
            let columnas = 10;

            if (juegoLower === '72' || juegoLower === 'bingo72') { totalNums = 72; columnas = 9; }
            else if (juegoLower === '90' || juegoLower === 'bingo90') { totalNums = 90; }
            else if (juegoLower === '100' || juegoLower === 'bingo100') { totalNums = 100; }
            else if (juegoLower === 'eliminatorias') { totalNums = 30; columnas = 6; }

            grid.style.gridTemplateColumns = `repeat(${columnas}, 1fr)`;
            for(let i = 1; i <= totalNums; i++) {
                const esta = sacados.includes(i) || sacados.includes(String(i)) || sacados.includes(Number(i));
                const textoCelda = juegoLower === 'eliminatorias' ? `P${i}` : i;
                gridHtml += `<div class="celda-sort ${esta ? 'marcada' : ''}">${textoCelda}</div>`;
            }
            grid.innerHTML = gridHtml;
        }

        window.cambiarSorteador = function(val) {
            if (val) window.cargarModuloJuego(val);
        };

        window.crearUsuarioDesdeSorteador = async function() {
            const nick = document.getElementById('sort-nuevo-nick').value.trim().toUpperCase();
            const pin = document.getElementById('sort-nuevo-pin').value.trim();
            const sexo = document.getElementById('sort-nuevo-sexo').value;
            const errDiv = document.getElementById('sort-err-usr');

            if (!nick || !pin) {
                errDiv.innerText = "Completa nick y PIN";
                return;
            }

            try {
                await setDoc(doc(db, "proyectos", idProyecto, "registrados", nick), {
                    nick: nick,
                    pin: pin,
                    sexo: sexo,
                    genero: sexo === 'H' ? 'HOMBRE' : 'MUJER',
                    creado: Date.now()
                });
                document.getElementById('sort-nuevo-nick').value = '';
                document.getElementById('sort-nuevo-pin').value = '';
                errDiv.innerText = "";
                alert("Usuario creado correctamente");
            } catch (e) {
                errDiv.innerText = "Error al crear usuario";
                console.error(e);
            }
        };

        function escucharRegistrados() {
            const regRef = collection(db, "proyectos", idProyecto, "registrados");

            onSnapshot(regRef, (snapshot) => {
                listaUsuariosGlobal = [];
                let cntH = 0, cntM = 0;

                snapshot.forEach(docSnap => {
                    const usr = { id: docSnap.id, ...docSnap.data() };
                    listaUsuariosGlobal.push(usr);
                    if (usr.sexo === "H" || usr.genero === "HOMBRE") cntH++;
                    else cntM++;
                });

                const btnReg = document.getElementById("btnRegistrados");
                if (btnReg) btnReg.innerHTML = `<i class="fas fa-users"></i> REGISTRADOS (${listaUsuariosGlobal.length})`;

                const elTot = document.getElementById("cntTotal");
                const elH = document.getElementById("cntH");
                const elM = document.getElementById("cntM");

                if (elTot) elTot.innerText = listaUsuariosGlobal.length;
                if (elH) elH.innerText = cntH;
                if (elM) elM.innerText = cntM;

                renderizarListaRegistrados();
            });
        }

        function renderizarListaRegistrados() {
            const cont = document.getElementById("listaRegistrados");
            if (!cont) return;

            if (listaUsuariosGlobal.length === 0) {
                cont.innerHTML = "<p>No hay usuarios registrados aún.</p>";
                return;
            }

            cont.innerHTML = "";
            listaUsuariosGlobal.forEach(u => {
                const div = document.createElement("div");
                div.className = "tarjeta-usuario";
                div.innerHTML = `
                    <div>
                        <span class="btn-sexo" onclick="toggleSexo('${u.id}', '${u.sexo}')">
                            ${(u.sexo === "H" || u.genero === "HOMBRE") ? "💙 ♂" : "💖 ♀"}
                        </span>
                        <strong>${u.nick || u.id}</strong> (PIN: ${u.pin || 'S/N'})
                    </div>
                    <button class="btn-eliminar" onclick="eliminarUsuario('${u.id}')">Eliminar</button>
                `;
                cont.appendChild(div);
            });
        }

        window.toggleSexo = async function(idUsr, sexoActual) {
            const nuevoSexo = sexoActual === "H" ? "M" : "H";
            const userRef = doc(db, "proyectos", idProyecto, "registrados", idUsr);
            await updateDoc(userRef, { sexo: nuevoSexo, genero: nuevoSexo === "H" ? "HOMBRE" : "MUJER" });
        };

        window.eliminarUsuario = async function(idUsr) {
            if (!confirm(`¿Borrar a ${idUsr}?`)) return;
            await deleteDoc(doc(db, "proyectos", idProyecto, "registrados", idUsr));
        };

        window.abrirModalRegistrados = () => {
            const modal = document.getElementById("modalRegistrados");
            if (modal) modal.style.display = "flex";
        };
        window.cerrarModalRegistrados = () => {
            const modal = document.getElementById("modalRegistrados");
            if (modal) modal.style.display = "none";
        };
    </script>
</body>
</html>
